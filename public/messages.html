    <style id="theme-vars">
:root {
  --playarg-background: #0b0c10;

  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;

  --playarg-radius-medium: 8px;

  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}
html, body { font-family: var(--font-sans); background: var(--playarg-background); color: var(--playarg-foreground); }
.font-mono { font-family: var(--font-mono); }
.glow-text { text-shadow: 0 0 18px rgba(0, 217, 255, 0.35); }
.glow-border { box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--playarg-background); }
::-webkit-scrollbar-thumb { background: var(--playarg-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3f4d; }
pre, code { font-family: var(--font-mono); }

    <script>
      (function() {
        try {
          var t = localStorage.getItem('playarg_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();

<script src="/auth.js"></script>
<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function formatContent(str) {
    if (str == null) return '';
    var html = escapeHtml(str);
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s<>()]+)\)/g, function (m, text, url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="underline opacity-90 hover:opacity-100">' + text + '</a>';
    });
    html = html.replace(/(^|[\s(（])(https?:\/\/[^\s<>）)]+)/g, function (m, prefix, url) {
      return prefix + '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="underline opacity-90 hover:opacity-100">' + url + '</a>';
    });
    return html;
  }
  function formatDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function initials(name) {
    return String(name || '?').slice(0, 2).toUpperCase();
  }
  function getLocalUser() {
    try { var raw = localStorage.getItem('playarg_user'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }

  var params = new URLSearchParams(location.search);
  var selectedUser = params.get('user');
  var contacts = [];
  var userCache = {};
  var currentUser = getLocalUser();
  var pollTimer = null;
  var searchTimer = null;

  function cacheUser(u) {
    if (u && u.username) userCache[u.username] = u;
  }

  function adminTag(user) {
    if (!user) return '';
    if (user.isOwner) return '<span class="ml-1.5 shrink-0 rounded bg-[var(--playarg-accent-purple)]/20 px-1.5 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">站主</span>';
    if (user.role === 'admin') return '<span class="ml-1.5 shrink-0 rounded bg-[var(--playarg-accent-purple)]/20 px-1.5 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">' + escapeHtml(user.adminBadgeText || '管理员') + '</span>';
    return '';
  }

  function usernameClass(user) {
    return (user && (user.role === 'admin' || user.isOwner)) ? 'text-[var(--playarg-accent-purple)]' : 'text-[var(--playarg-foreground)]';
  }

  function renderContactList() {
    var el = document.getElementById('contacts-list');
    if (!contacts.length) {
      el.innerHTML = '<div class="p-4 text-center text-sm text-[var(--playarg-muted-foreground)]">暂无联系人<br><span class="text-xs">在上方搜索用户名开始私信</span></div>';
      return;
    }
    el.innerHTML = contacts.map(function (c) {
      var u = userCache[c.username] || c;
      cacheUser(u);
      var activeClass = c.username === selectedUser ? 'bg-[var(--playarg-primary-dim)] text-[var(--playarg-primary)]' : 'hover:bg-[var(--playarg-muted)]';
      var snippet = c.lastMessage ? (c.lastMessage.senderUsername === (currentUser && currentUser.username) ? '我：' : '') + c.lastMessage.content : '';
      var date = c.lastMessage ? formatDateTime(c.lastMessage.createdAt).slice(5, 10) : '';
      return '<a href="/messages?user=' + encodeURIComponent(c.username) + '" class="contact-item flex items-center gap-3 rounded-md p-2 transition-colors ' + activeClass + '">' +
        '<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[var(--playarg-primary-subtle)] text-xs font-medium text-[var(--playarg-primary)]">' + initials(c.username) + '</div>' +
        '<div class="min-w-0 flex-1">' +
          '<div class="flex items-center justify-between">' +
            '<span class="flex min-w-0 items-center truncate text-sm ' + usernameClass(u) + '">' + escapeHtml(c.username) + adminTag(u) + '</span>' +
            '<span class="ml-2 shrink-0 text-xs text-[var(--playarg-muted-foreground)]">' + escapeHtml(date) + '</span>' +
          '</div>' +
          '<div class="flex items-center justify-between">' +
            '<span class="truncate text-xs text-[var(--playarg-muted-foreground)]">' + escapeHtml(snippet) + '</span>' +
            (c.unread ? '<span class="ml-2 shrink-0 rounded-full bg-[var(--playarg-state-error)] px-1.5 text-[10px] font-medium text-white">' + c.unread + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</a>';
    }).join('');
  }

  function renderSearchPrompt(keyword) {
    var el = document.getElementById('contacts-list');
    el.innerHTML = '<div class="p-4 text-center text-sm text-[var(--playarg-muted-foreground)]">正在搜索 “' + escapeHtml(keyword) + '”…</div>';
  }

  function renderSearchResults(users) {
    var el = document.getElementById('contacts-list');
    if (!users.length) {
      el.innerHTML = '<div class="p-4 text-center text-sm text-[var(--playarg-muted-foreground)]">未找到用户</div>';
      return;
    }
    el.innerHTML = users.map(function (u) {
      cacheUser(u);
      var isMe = currentUser && String(u.id) === String(currentUser.id);
      var meLabel = isMe ? '<span class="ml-2 text-xs text-[var(--playarg-muted-foreground)]">(自己)</span>' : '';
      return '<a href="/messages?user=' + encodeURIComponent(u.username) + '" class="contact-item flex items-center gap-3 rounded-md p-2 transition-colors hover:bg-[var(--playarg-muted)]">' +
        '<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[var(--playarg-primary-subtle)] text-xs font-medium text-[var(--playarg-primary)]">' + initials(u.username) + '</div>' +
        '<div class="min-w-0 flex-1">' +
          '<div class="flex items-center">' +
            '<span class="flex min-w-0 items-center truncate text-sm ' + usernameClass(u) + '">' + escapeHtml(u.username) + adminTag(u) + meLabel + '</span>' +
          '</div>' +
          '<div class="text-xs text-[var(--playarg-muted-foreground)]">点击开始私信</div>' +
        '</div>' +
      '</a>';
    }).join('');
  }

  function doSearch(keyword) {
    if (!keyword) { renderContactList(); return; }
    fetch('/api/user?search=' + encodeURIComponent(keyword), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json.ok) renderSearchResults(json.data || []);
        else renderSearchResults([]);
      })
      .catch(function () { renderSearchResults([]); });
  }

  function renderConversation(list, other) {
    cacheUser(other);
    var header = document.getElementById('chat-header');
    header.innerHTML = '<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[var(--playarg-primary-subtle)] text-xs font-medium text-[var(--playarg-primary)]">' + initials(other.username) + '</div>' +
      '<span class="flex min-w-0 items-center truncate font-medium ' + usernameClass(other) + '">' + escapeHtml(other.username) + adminTag(other) + '</span>';
    var el = document.getElementById('chat-messages');
    if (!list.length) {
      el.innerHTML = '<div class="flex h-full items-center justify-center text-sm text-[var(--playarg-muted-foreground)]">还没有消息，发个私信吧</div>';
    } else {
      el.innerHTML = list.map(function (m) {
        var isMe = currentUser && String(m.senderId) === String(currentUser.id);
        var sender = isMe ? currentUser : (userCache[m.senderUsername] || { username: m.senderUsername });
        return '<div class="mb-4 flex ' + (isMe ? 'justify-end' : 'justify-start') + '">' +
          '<div class="max-w-[70%] rounded-lg px-3 py-2 text-sm ' + (isMe ? 'bg-[var(--playarg-primary)] text-[var(--playarg-primary-foreground)]' : 'bg-[var(--playarg-muted)] text-[var(--playarg-foreground)]') + '">' +
            '<div class="mb-1 flex items-center text-xs ' + (isMe ? 'text-[var(--playarg-primary-foreground)]/70' : 'text-[var(--playarg-accent-purple)]') + '">' +
              '<span class="truncate font-medium ' + (isMe ? '' : usernameClass(sender)) + '">' + escapeHtml(sender.username || m.senderUsername) + '</span>' + (isMe ? '' : adminTag(sender)) +
            '</div>' +
            '<div class="whitespace-pre-wrap">' + formatContent(m.content) + '</div>' +
            '<div class="mt-1 text-right text-[10px] opacity-70">' + escapeHtml(formatDateTime(m.createdAt)) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      el.scrollTop = el.scrollHeight;
    }
    document.getElementById('chat-input-area').classList.remove('hidden');
  }

  function loadContacts() {
    fetch('/api/messages?contacts=1', { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json.ok) {
          contacts = json.data || [];
          contacts.forEach(cacheUser);
          renderContactList();
          if (selectedUser) loadConversation();
        }
      })
      .catch(function (err) { console.error('[messages contacts]', err); });
  }

  function loadConversation() {
    if (!selectedUser) return;
    fetch('/api/messages?user=' + encodeURIComponent(selectedUser), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json.ok) {
          if (json.user) cacheUser(json.user);
          renderConversation(json.data || [], json.user || { username: selectedUser });
          updateBadges();
        } else {
          document.getElementById('chat-messages').innerHTML = '<div class="flex h-full items-center justify-center text-sm text-[var(--playarg-state-error)]">' + escapeHtml(json.error || '加载失败') + '</div>';
        }
      })
      .catch(function (err) { console.error('[messages conversation]', err); });
  }

  function sendMessage() {
    var input = document.getElementById('message-input');
    var content = input.value.trim();
    if (!content || !selectedUser) return;
    input.value = '';
    fetch('/api/messages', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: selectedUser, content: content }) })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json.ok) { loadConversation(); loadContacts(); }
        else { alert(json.error || '发送失败'); }
      })
      .catch(function () { alert('网络错误'); });
  }

  function updateBadges() {
    fetch('/api/notifications', { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) {
        var badge = document.getElementById('nav-notifications-badge');
        if (j.unread) { badge.textContent = j.unread > 99 ? '99+' : j.unread; badge.classList.remove('hidden'); }
        else badge.classList.add('hidden');
      }
    }).catch(function () {});
    fetch('/api/messages?contacts=1', { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) {
        var total = (j.data || []).reduce(function (s, c) { return s + (c.unread || 0); }, 0);
        var badge = document.getElementById('nav-messages-badge');
        if (total) { badge.textContent = total > 99 ? '99+' : total; badge.classList.remove('hidden'); }
        else badge.classList.add('hidden');
      }
    }).catch(function () {});
  }

  document.getElementById('contact-search').addEventListener('input', function () {
    var keyword = document.getElementById('contact-search').value.trim();
    if (searchTimer) clearTimeout(searchTimer);
    if (!keyword) { renderContactList(); return; }
    renderSearchPrompt(keyword);
    searchTimer = setTimeout(function () { doSearch(keyword); }, 300);
  });
  document.getElementById('btn-send').addEventListener('click', sendMessage);
  document.getElementById('message-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  loadContacts();
  updateBadges();
  if (selectedUser) {
    pollTimer = setInterval(function () { loadConversation(); loadContacts(); }, 5000);
  }
})();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
