    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

<script>
(function () {
  'use strict';

  const user = JSON.parse(localStorage.getItem('playarg_user') || 'null');
  if (!user || user.role !== 'admin') {
    document.body.innerHTML = '<div class="flex min-h-screen items-center justify-center text-[var(--playarg-muted-foreground)]">需要管理员权限，<a href="/" class="ml-1 text-[var(--playarg-primary)] hover:underline">返回首页</a></div>';
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const contestId = params.get('id');
  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const panelEl = document.getElementById('binding-panel');
  const subtitleEl = document.getElementById('contest-subtitle');
  const selectedTbody = document.getElementById('selected-tbody');
  const availableTbody = document.getElementById('available-tbody');
  const problemSearch = document.getElementById('problem-search');
  const selectedCountEl = document.getElementById('selected-count');
  const saveBtn = document.querySelector('[data-dom-id="btn-save-binding"]');

  let contest = null;
  let allProblems = [];
  let selectedIds = [];

  function showError(msg) {
    loadingEl.classList.add('hidden');
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  }

  function renderBadge(text, colorClass) {
    return '<span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ' + colorClass + '">' + text + '</span>';
  }

  function visibilityBadge(v) {
    switch (v) {
      case 'public': return renderBadge('公开', 'bg-[var(--playarg-state-success)]/10 text-[var(--playarg-state-success)]');
      case 'contest': return renderBadge('比赛', 'bg-[var(--playarg-primary)]/10 text-[var(--playarg-primary)]');
      case 'hidden': return renderBadge('隐藏', 'bg-[var(--playarg-muted-foreground)]/10 text-[var(--playarg-muted-foreground)]');
      default: return renderBadge('公开', 'bg-[var(--playarg-state-success)]/10 text-[var(--playarg-state-success)]');
    }
  }

  var DIFFICULTY_MAP = {
    l1: { label: 'Level 1', color: 'text-[#f43f5e]' },
    l2: { label: 'Level 2', color: 'text-[#f97316]' },
    l3: { label: 'Level 3', color: 'text-[#eab308]' },
    l4: { label: 'Level 4', color: 'text-[#22c55e]' },
    l5: { label: 'Level 5', color: 'text-[#14b8a6]' },
    l6: { label: 'Level 6', color: 'text-[#3b82f6]' },
    l7: { label: 'Level 7', color: 'text-[#a855f7]' }
  };

  function difficultyBadge(d) {
    const cfg = DIFFICULTY_MAP[String(d || '').toLowerCase()] || { label: d || '未知', color: 'text-[var(--playarg-muted-foreground)]' };
    return '<span class="font-medium ' + cfg.color + '">' + cfg.label + '</span>';
  }

  function renderSelected() {
    selectedCountEl.textContent = selectedIds.length + ' 题';
    if (!selectedIds.length) {
      selectedTbody.innerHTML = '<tr id="empty-selected"><td colspan="6" class="py-8 text-center text-sm text-[var(--playarg-muted-foreground)]">暂未选择题目</td></tr>';
      lucide.createIcons();
      return;
    }
    selectedTbody.innerHTML = selectedIds.map(function (pid, idx) {
      const p = allProblems.find(function (x) { return String(x.id) === String(pid); });
      if (!p) return '';
      return '<tr class="border-b border-[var(--playarg-border)] last:border-b-0">' +
        '<td class="py-3 pr-4 align-middle font-mono text-[var(--playarg-foreground)]">' + String.fromCharCode(65 + idx) + '</td>' +
        '<td class="py-3 pr-4 align-middle font-mono text-xs text-[var(--playarg-muted-foreground)]">' + p.id + '</td>' +
        '<td class="py-3 pr-4 align-middle text-[var(--playarg-foreground)]">' + (p.title || '未命名') + '</td>' +
        '<td class="py-3 pr-4 align-middle">' + difficultyBadge(p.difficulty) + '</td>' +
        '<td class="py-3 pr-4 align-middle">' + visibilityBadge(p.visibility) + '</td>' +
        '<td class="py-3 pr-4 align-middle">' +
          '<button type="button" data-remove-id="' + p.id + '" class="inline-flex items-center gap-1 rounded-md px-2 py-1.5 text-xs text-[var(--playarg-state-error)] transition-colors hover:bg-[var(--playarg-state-error)]/10">' +
            '<i data-lucide="trash-2" class="h-3.5 w-3.5"></i><span>移除</span>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    selectedTbody.querySelectorAll('[data-remove-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.getAttribute('data-remove-id');
        selectedIds = selectedIds.filter(function (x) { return String(x) !== String(id); });
        renderSelected();
        renderAvailable(problemSearch.value.trim());
      });
    });
    lucide.createIcons();
  }

  function renderAvailable(keyword) {
    const lower = (keyword || '').toLowerCase();
    const available = allProblems.filter(function (p) {
      if (selectedIds.some(function (sid) { return String(sid) === String(p.id); })) return false;
      if (!lower) return true;
      return String(p.id).toLowerCase().indexOf(lower) !== -1 ||
        String(p.title || '').toLowerCase().indexOf(lower) !== -1;
    });

    if (!available.length) {
      availableTbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-sm text-[var(--playarg-muted-foreground)]">没有可添加的题目</td></tr>';
      return;
    }

    availableTbody.innerHTML = available.map(function (p) {
      return '<tr class="border-b border-[var(--playarg-border)] last:border-b-0">' +
        '<td class="py-3 pr-4 align-middle font-mono text-xs text-[var(--playarg-muted-foreground)]">' + p.id + '</td>' +
        '<td class="py-3 pr-4 align-middle text-[var(--playarg-foreground)]">' + (p.title || '未命名') + '</td>' +
        '<td class="py-3 pr-4 align-middle">' + difficultyBadge(p.difficulty) + '</td>' +
        '<td class="py-3 pr-4 align-middle">' + visibilityBadge(p.visibility) + '</td>' +
        '<td class="py-3 pr-4 align-middle">' +
          '<button type="button" data-add-id="' + p.id + '" class="inline-flex items-center gap-1 rounded-md px-2 py-1.5 text-xs text-[var(--playarg-primary)] transition-colors hover:bg-[var(--playarg-primary)]/10">' +
            '<i data-lucide="plus" class="h-3.5 w-3.5"></i><span>添加</span>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    availableTbody.querySelectorAll('[data-add-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.getAttribute('data-add-id');
        if (!selectedIds.some(function (sid) { return String(sid) === String(id); })) {
          selectedIds.push(id);
        }
        renderSelected();
        renderAvailable(problemSearch.value.trim());
      });
    });
    lucide.createIcons();
  }

  async function init() {
    if (!contestId) {
      showError('缺少比赛 ID');
      return;
    }

    try {
      const [contestRes, problemsRes] = await Promise.all([
        fetch('/api/contests?id=' + encodeURIComponent(contestId)),
        fetch('/api/data?type=problems')
      ]);
      const contestData = await contestRes.json();
      const problemsData = await problemsRes.json();

      if (!contestData.ok) {
        showError(contestData.error || '加载比赛失败');
        return;
      }
      if (!problemsData.ok) {
        showError(problemsData.error || '加载题库失败');
        return;
      }

      contest = contestData.data;
      subtitleEl.textContent = (contest.title || contest.id) + ' · ' + (contest.organizer || '无举办者');
      selectedIds = Array.isArray(contest.problems) ? contest.problems.map(String) : [];
      allProblems = Array.isArray(problemsData.data) ? problemsData.data : [];

      loadingEl.classList.add('hidden');
      panelEl.classList.remove('hidden');

      renderSelected();
      renderAvailable('');
    } catch (err) {
      console.error(err);
      showError('网络错误，请刷新重试');
    }
  }

  problemSearch.addEventListener('input', function () {
    renderAvailable(this.value.trim());
  });

  saveBtn.addEventListener('click', async function () {
    if (!contest) return;
    saveBtn.disabled = true;
    const originalHtml = saveBtn.innerHTML;
    saveBtn.innerHTML = '<i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i><span>保存中...</span>';
    lucide.createIcons();

    try {
      const res = await fetch('/api/contests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'update',
          item: {
            id: contest.id,
            title: contest.title,
            description: contest.description,
            startTime: contest.startTime,
            endTime: contest.endTime,
            organizer: contest.organizer,
            mode: contest.mode,
            problems: selectedIds
          }
        })
      });
      const data = await res.json();
      if (data.ok) {
        alert('保存成功');
        window.location.href = '/admin';
      } else {
        alert(data.error || '保存失败');
      }
    } catch (err) {
      alert('网络错误，请重试');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = originalHtml;
      lucide.createIcons();
    }
  });

  init();
})();
</script>
</body>
</html>
