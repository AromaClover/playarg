    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

            document.documentElement.setAttribute('data-theme', 'dark');

<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function formatContent(str) {
    if (str == null) return '';
    var html = escapeHtml(str);
    // [text](url) -> link
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s<>()]+)\)/g, function (m, text, url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="text-[var(--playarg-primary)] hover:underline">' + text + '</a>';
    });
    // bare urls not already in a tag
    html = html.replace(/(^|[\s(（])(https?:\/\/[^\s<>）)]+)/g, function (m, prefix, url) {
      return prefix + '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="text-[var(--playarg-primary)] hover:underline">' + url + '</a>';
    });
    // @username -> user profile link
    html = html.replace(/(^|\s)@([a-zA-Z0-9_\u4e00-\u9fa5]+)/g, function (m, prefix, name) {
      return prefix + '<a href="/user-profile?username=' + encodeURIComponent(name) + '" class="text-[var(--playarg-primary)] hover:underline">@' + name + '</a>';
    });
    return html;
  }
  function relativeTime(iso) {
    var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    return Math.floor(diff / 86400) + ' 天前';
  }
  function initials(name) {
    return String(name || '?').slice(0, 2).toUpperCase();
  }
  function getLocalUser() {
    try { var raw = localStorage.getItem('playarg_user'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }

  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if (!id) {
    var pathParts = location.pathname.split('/').filter(Boolean);
    var last = pathParts[pathParts.length - 1] || '';
    if (last && last !== 'discussion' && last !== 'discussion-detail') id = decodeURIComponent(last);
  }
  var detailCard = document.getElementById('detail-card');
  var repliesList = document.getElementById('replies-list');
  var repliesHeading = document.getElementById('replies-heading');
  var replyForm = document.getElementById('reply-form');
  var replyLoginHint = document.getElementById('reply-login-hint');
  var replyContent = document.getElementById('reply-content');
  var replyError = document.getElementById('reply-error');
  var btnSubmitReply = document.getElementById('btn-submit-reply');
  var adminEditForm = document.getElementById('admin-edit-form');
  var adminEditTitle = document.getElementById('admin-edit-title');
  var adminEditContent = document.getElementById('admin-edit-content');
  var adminEditTags = document.getElementById('admin-edit-tags');
  var adminEditError = document.getElementById('admin-edit-error');
  var adminEditSave = document.getElementById('admin-edit-save');
  var adminEditCancel = document.getElementById('admin-edit-cancel');
  var currentDiscussion = null;

  function isAdmin() {
    var user = getLocalUser();
    return !!(user && user.role === 'admin');
  }
  function adminTag(item, keyPrefix) {
    var isOwner = item[keyPrefix + 'IsOwner'];
    var role = item[keyPrefix + 'Role'];
    var badgeText = item[keyPrefix + 'AdminBadgeText'];
    if (isOwner) return '<span class="ml-1 inline-flex items-center rounded-full bg-[var(--playarg-accent-purple)]/15 px-2 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">站主</span>';
    if (role === 'admin') return '<span class="ml-1 inline-flex items-center rounded-full bg-[var(--playarg-accent-purple)]/15 px-2 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">' + escapeHtml(badgeText || '管理员') + '</span>';
    return '';
  }
  function usernameClass(item, keyPrefix) {
    return (item[keyPrefix + 'IsOwner'] || item[keyPrefix + 'Role'] === 'admin') ? 'text-[var(--playarg-accent-purple)]' : 'text-[var(--playarg-primary)]';
  }

  function backLinkHtml() {
    return '<a href="/discussions" class="text-[var(--playarg-primary)] hover:underline">返回讨论区</a>';
  }

  function renderNotFound() {
    detailCard.innerHTML = '<div class="text-center text-sm text-[var(--playarg-muted-foreground)]">帖子不存在或已被删除，' + backLinkHtml() + '</div>';
    repliesHeading.textContent = '0 条回复';
    repliesList.innerHTML = '';
  }

  function renderTags(tags) {
    return (tags || []).map(function (t) {
      return '<span class="rounded px-2 py-0.5 text-xs font-medium bg-[var(--playarg-muted)] text-[var(--playarg-muted-foreground)]">' + escapeHtml(t) + '</span>';
    }).join('');
  }

  function adminActionsHtml() {
    if (!isAdmin()) return '';
    return '<div class="mt-2 flex flex-wrap items-center gap-2">' +
      '<button id="admin-btn-edit" class="inline-flex items-center gap-1 rounded-md border border-[var(--playarg-border)] px-3 py-1.5 text-xs text-[var(--playarg-foreground)] transition-colors hover:bg-[var(--playarg-muted)]"><i data-lucide="pencil" class="h-3 w-3"></i>编辑</button>' +
      '<button id="admin-btn-delete" class="inline-flex items-center gap-1 rounded-md border border-[var(--playarg-state-error)]/30 px-3 py-1.5 text-xs text-[var(--playarg-state-error)] transition-colors hover:bg-[var(--playarg-state-error)]/10"><i data-lucide="trash-2" class="h-3 w-3"></i>删除</button>' +
    '</div>';
  }

  function renderDetail(d) {
    detailCard.innerHTML = '<div class="flex flex-col gap-4">' +
      '<h1 class="text-xl font-semibold tracking-tight text-[var(--playarg-foreground)]">' + escapeHtml(d.title) + '</h1>' +
      '<div class="flex flex-wrap items-center gap-2 text-sm text-[var(--playarg-muted-foreground)]">' +
        '<span class="flex items-center gap-1 font-medium ' + usernameClass(d, 'author') + '"><i data-lucide="user" class="h-3.5 w-3.5"></i>' + escapeHtml(d.author) + adminTag(d, 'author') + '</span>' +
        '<span class="h-3 w-px bg-[var(--playarg-border)]"></span>' +
        '<span>' + escapeHtml(relativeTime(d.createdAt)) + ' 发布</span>' +
      '</div>' +
      '<div class="flex flex-wrap items-center gap-2">' + renderTags(d.tags) + '</div>' +
      '<div class="whitespace-pre-wrap text-sm leading-relaxed text-[var(--playarg-foreground)]">' + formatContent(d.content) + '</div>' +
      adminActionsHtml() +
    '</div>';
    bindAdminDetailActions();
  }

  function bindAdminDetailActions() {
    var editBtn = document.getElementById('admin-btn-edit');
    var deleteBtn = document.getElementById('admin-btn-delete');
    if (editBtn) {
      editBtn.addEventListener('click', function () {
        if (!currentDiscussion) return;
        adminEditTitle.value = currentDiscussion.title || '';
        adminEditContent.value = currentDiscussion.content || '';
        adminEditTags.value = (currentDiscussion.tags || []).join(', ');
        adminEditError.classList.add('hidden');
        adminEditForm.classList.remove('hidden');
        adminEditForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }
    if (deleteBtn) {
      deleteBtn.addEventListener('click', function () {
        if (!currentDiscussion) return;
        if (!confirm('确定删除该讨论帖？')) return;
        fetch('/api/admin/discussions', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: currentDiscussion.id })
        })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            if (json.ok) {
              alert('帖子已删除');
              location.href = 'discussion';
            } else {
              alert(json.error || '删除失败');
            }
          })
          .catch(function () { alert('网络错误'); });
      });
    }
  }

  function hideAdminEditForm() {
    adminEditForm.classList.add('hidden');
    adminEditError.classList.add('hidden');
  }

  function submitAdminEdit() {
    if (!currentDiscussion) return;
    var title = adminEditTitle.value.trim();
    var content = adminEditContent.value.trim();
    var tags = adminEditTags.value.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
    if (!title) { adminEditError.textContent = '标题不能为空'; adminEditError.classList.remove('hidden'); return; }
    if (!content) { adminEditError.textContent = '正文不能为空'; adminEditError.classList.remove('hidden'); return; }
    adminEditError.classList.add('hidden');
    adminEditSave.disabled = true;
    fetch('/api/admin/discussions', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'update', id: currentDiscussion.id, title: title, content: content, tags: tags })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        adminEditSave.disabled = false;
        if (json.ok) {
          hideAdminEditForm();
          loadDetail();
        } else {
          adminEditError.textContent = json.error || '保存失败';
          adminEditError.classList.remove('hidden');
        }
      })
      .catch(function () {
        adminEditSave.disabled = false;
        adminEditError.textContent = '网络错误';
        adminEditError.classList.remove('hidden');
      });
  }

  function renderReplies(replies) {
    var list = Array.isArray(replies) ? replies : [];
    repliesHeading.textContent = list.length + ' 条回复';
    if (!list.length) {
      repliesList.innerHTML = '<div class="text-sm text-[var(--playarg-muted-foreground)]">暂无回复，来做第一个回复的人吧！</div>';
      return;
    }
    repliesList.innerHTML = list.map(function (r) {
      return '<article class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-background)] p-4">' +
        '<div class="mb-2 flex flex-wrap items-center gap-2 text-xs text-[var(--playarg-muted-foreground)]">' +
          '<span class="flex items-center gap-1 font-medium ' + usernameClass(r, 'author') + '"><i data-lucide="user" class="h-3 w-3"></i>' + escapeHtml(r.author || '匿名') + adminTag(r, 'author') + '</span>' +
          '<span class="h-3 w-px bg-[var(--playarg-border)]"></span>' +
          '<span>' + escapeHtml(relativeTime(r.createdAt)) + '</span>' +
        '</div>' +
        '<div class="whitespace-pre-wrap text-sm leading-relaxed text-[var(--playarg-foreground)]">' + formatContent(r.content) + '</div>' +
      '</article>';
    }).join('');
  }

  function loadDetail() {
    if (!id) {
      detailCard.innerHTML = '<div class="text-center text-sm text-[var(--playarg-muted-foreground)]">缺少帖子 ID，' + backLinkHtml() + '</div>';
      repliesHeading.textContent = '0 条回复';
      repliesList.innerHTML = '';
      return;
    }
    fetch('/api/discussions?id=' + encodeURIComponent(id), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        var d = (json && json.data) || json;
        if (!d || !d.id) { renderNotFound(); return; }
        currentDiscussion = d;
        renderDetail(d);
        renderReplies(d.replies);
        if (typeof lucide !== 'undefined') lucide.createIcons();
      })
      .catch(function (err) {
        console.error('[discussion-detail]', err);
        detailCard.innerHTML = '<div class="text-center text-sm text-[var(--playarg-state-error)]">加载失败，' + backLinkHtml() + '</div>';
      });
  }

  function updateReplyFormVisibility() {
    if (getLocalUser()) {
      replyForm.classList.remove('hidden');
      replyLoginHint.classList.add('hidden');
    } else {
      replyForm.classList.add('hidden');
      replyLoginHint.classList.remove('hidden');
    }
  }

  updateReplyFormVisibility();

  btnSubmitReply.addEventListener('click', function () {
    var user = getLocalUser();
    if (!user) { updateReplyFormVisibility(); return; }
    var content = replyContent.value.trim();
    if (!content) { replyError.textContent = '回复内容不能为空'; replyError.classList.remove('hidden'); return; }
    replyError.classList.add('hidden');
    btnSubmitReply.disabled = true;
    fetch('/api/discussions', {
      method: 'POST',
      cache: 'no-store',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ discussionId: id, content: content })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        btnSubmitReply.disabled = false;
        if (json.ok) { replyContent.value = ''; loadDetail(); }
        else { replyError.textContent = json.error || '回复失败'; replyError.classList.remove('hidden'); }
      })
      .catch(function (err) {
        btnSubmitReply.disabled = false;
        replyError.textContent = '网络错误'; replyError.classList.remove('hidden');
        console.error(err);
      });
  });

  if (adminEditSave) adminEditSave.addEventListener('click', submitAdminEdit);
  if (adminEditCancel) adminEditCancel.addEventListener('click', hideAdminEditForm);

  loadDetail();
})();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
