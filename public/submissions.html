    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

<script>
(function () {
  var PAGE_SIZE = 10;
  var allSubmissions = [];
  var filteredSubmissions = [];
  var currentPage = 1;

  var problemInput = document.getElementById('filter-problem');
  var resultSelect = document.getElementById('filter-result');
  var searchBtn = document.getElementById('btn-search');
  var tbody = document.getElementById('submissions-body');
  var paginationEl = document.getElementById('submissions-pagination');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDate(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    var pad = function (n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function getResultDisplay(status) {
    if (status === 'accepted') return { text: '通过', className: 'status-success', icon: 'check-circle' };
    return { text: '错误', className: 'status-error', icon: 'x-circle' };
  }

  function loadSubmissions() {
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-sm text-[var(--playarg-muted-foreground)]">加载中…</td></tr>';
    fetch('/api/submissions', { credentials: 'same-origin' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json.ok) {
          allSubmissions = json.data || [];
          applyFilters();
        } else {
          if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-sm text-[var(--playarg-state-error)]">' + escapeHtml(json.error || '加载失败') + '</td></tr>';
        }
      })
      .catch(function () {
        if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-sm text-[var(--playarg-state-error)]">网络错误</td></tr>';
      });
  }

  function applyFilters() {
    var problemQuery = (problemInput ? problemInput.value : '').trim().toLowerCase();
    var resultValue = resultSelect ? resultSelect.value : '';

    filteredSubmissions = allSubmissions.filter(function (s) {
      if (resultValue === 'accepted' && s.status !== 'accepted') return false;
      if (resultValue === 'wrong' && s.status === 'accepted') return false;
      if (problemQuery) {
        var problemField = String(s.problemTitle || s.problemId || '').toLowerCase();
        if (problemField.indexOf(problemQuery) === -1) return false;
      }
      return true;
    });

    currentPage = 1;
    render();
  }

  function render() {
    renderTable();
    renderPagination();
    if (window.lucide && lucide.createIcons) lucide.createIcons();
  }

  function adminTag(s) {
    if (s.isOwner) return '<span class="ml-1 inline-flex items-center rounded-full bg-[var(--playarg-accent-purple)]/15 px-1.5 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">站主</span>';
    if (s.role === 'admin') return '<span class="ml-1 inline-flex items-center rounded-full bg-[var(--playarg-accent-purple)]/15 px-1.5 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">' + escapeHtml(s.adminBadgeText || '管理员') + '</span>';
    return '';
  }
  function usernameClass(s) {
    return (s.isOwner || s.role === 'admin') ? 'text-[var(--playarg-accent-purple)]' : 'text-[var(--playarg-primary)]';
  }

  function renderTable() {
    if (!tbody) return;
    if (!filteredSubmissions.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-sm text-[var(--playarg-muted-foreground)]">暂无提交记录</td></tr>';
      return;
    }

    var start = (currentPage - 1) * PAGE_SIZE;
    var pageItems = filteredSubmissions.slice(start, start + PAGE_SIZE);

    tbody.innerHTML = pageItems.map(function (s) {
      var result = getResultDisplay(s.status);
      var userId = s.userId;
      var username = escapeHtml(s.username || '用户' + userId);
      var userLink = userId ? '<a href="/user/' + userId + '" class="' + usernameClass(s) + ' hover:underline">' + username + '</a>' + adminTag(s) : username;
      return '<tr class="transition-colors hover:bg-[var(--playarg-muted)]/50">' +
        '<td class="px-4 py-3 font-mono text-[var(--playarg-muted-foreground)]">#' + escapeHtml(s.id || '') + '</td>' +
        '<td class="px-4 py-3 font-medium text-[var(--playarg-foreground)]">' + escapeHtml(s.problemTitle || s.problemId || '-') + '</td>' +
        '<td class="px-4 py-3">' + userLink + '</td>' +
        '<td class="px-4 py-3"><span class="' + result.className + ' flex items-center gap-1.5"><i data-lucide="' + result.icon + '" class="h-4 w-4"></i>' + result.text + '</span></td>' +
        '<td class="px-4 py-3 font-mono text-[var(--playarg-muted-foreground)]">' + formatDate(s.createdAt) + '</td>' +
      '</tr>';
    }).join('');
  }

  function renderPagination() {
    if (!paginationEl) return;
    var total = filteredSubmissions.length;
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    var html = '<span class="text-sm text-[var(--playarg-muted-foreground)]">共 ' + total + ' 条提交</span>';
    if (totalPages > 1) {
      html += '<div class="flex items-center gap-1">';
      html += '<button id="page-prev" class="flex h-8 items-center justify-center rounded-md border border-[var(--playarg-border)] px-3 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)] disabled:opacity-50"' + (currentPage === 1 ? ' disabled' : '') + '><i data-lucide="chevron-left" class="mr-1 h-4 w-4"></i>上一页</button>';

      for (var i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          html += '<button class="flex h-8 w-8 items-center justify-center rounded-md bg-[var(--playarg-primary)] text-sm font-medium text-[var(--playarg-primary-foreground)]">' + i + '</button>';
        } else {
          html += '<button class="page-num flex h-8 w-8 items-center justify-center rounded-md border border-[var(--playarg-border)] text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)]" data-page="' + i + '">' + i + '</button>';
        }
      }

      html += '<button id="page-next" class="flex h-8 items-center justify-center rounded-md border border-[var(--playarg-border)] px-3 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)] disabled:opacity-50"' + (currentPage === totalPages ? ' disabled' : '') + '>下一页<i data-lucide="chevron-right" class="ml-1 h-4 w-4"></i></button>';
      html += '</div>';
    }
    paginationEl.innerHTML = html;

    var prevBtn = document.getElementById('page-prev');
    var nextBtn = document.getElementById('page-next');
    if (prevBtn) prevBtn.addEventListener('click', function () { if (currentPage > 1) { currentPage--; render(); } });
    if (nextBtn) nextBtn.addEventListener('click', function () { if (currentPage < totalPages) { currentPage++; render(); } });
    document.querySelectorAll('.page-num').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentPage = parseInt(btn.dataset.page, 10);
        render();
      });
    });
  }

  if (searchBtn) searchBtn.addEventListener('click', applyFilters);
  if (problemInput) problemInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') applyFilters(); });
  if (resultSelect) resultSelect.addEventListener('change', applyFilters);

  loadSubmissions();
})();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
