    <style id="theme-vars">

  --playarg-background: #0b0c10;

  --playarg-secondary-foreground: #d1d5db;
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;

  --playarg-radius-medium: 8px;

  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;

  --s-1: 4px;

  --s-4: 16px;

  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}
html, body { font-family: var(--font-sans); background: var(--playarg-background); color: var(--playarg-foreground); }
.font-mono { font-family: var(--font-mono); }
.glow-text { text-shadow: 0 0 18px rgba(0, 217, 255, 0.35); }
.glow-border { box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--playarg-background); }
::-webkit-scrollbar-thumb { background: var(--playarg-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3f4d; }
pre, code { font-family: var(--font-mono); }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('playarg_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
</head>
<body class="min-h-screen font-sans antialiased">
<!-- Top navigation -->
<header class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-[var(--playarg-border)] bg-[var(--playarg-background)]/90 backdrop-blur">
  <div class="flex h-full items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <a href="/" data-dom-id="nav-logo" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-[var(--playarg-primary)] glow-text">
        <img src="/assets/logo.png" class="h-8 w-auto rounded-md" alt="PlayARG" />
        <span>PlayARG</span>
      </a>
    </div>
    <nav class="flex items-center gap-4">
      <a href="/rules" class="text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-foreground)]">规则</a>
      <a href="/sponsors" class="text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-foreground)]">赞助我们</a>
      <button data-dom-id="nav-search" class="flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
        <i data-lucide="search" class="h-4 w-4"></i>
      </button>
      <a href="/messages" data-dom-id="nav-messages" class="relative flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
        <i data-lucide="mail" class="h-4 w-4"></i>
        <span id="nav-messages-badge" class="absolute -right-1 -top-1 hidden min-w-[16px] rounded-full bg-[var(--playarg-state-error)] px-1 text-[10px] font-medium text-white"></span>
      </a>
      <a href="/notifications" data-dom-id="nav-notifications" class="relative flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
        <i data-lucide="bell" class="h-4 w-4"></i>
        <span id="nav-notifications-badge" class="absolute -right-1 -top-1 hidden min-w-[16px] rounded-full bg-[var(--playarg-state-error)] px-1 text-[10px] font-medium text-white"></span>
      </a>
      <div id="auth-root" class="relative"></div>
    </nav>
  </div>
</header>

<!-- Sidebar -->
<aside class="fixed left-0 top-16 bottom-0 z-40 w-56 border-r border-[var(--playarg-border)] bg-[var(--playarg-card)]">

    <a href="/problems" data-dom-id="sidebar-problems" data-nav-key="problems" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)]">

      <span>题库</span>
    </a>
    <a href="/contests" data-dom-id="sidebar-contests" data-nav-key="contests" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)]">
      <i data-lucide="trophy" class="h-[18px] w-[18px]"></i>
      <span>比赛</span>
    </a>
    <a href="/submissions" data-dom-id="sidebar-submissions" data-nav-key="submissions" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)]">

<!-- Main content frame -->
<main id="main-content" class="ml-56 min-h-screen bg-[var(--playarg-background)] pt-16">
  <div class="p-6 lg:p-8">
    <div class="mx-auto max-w-4xl">
      <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-semibold tracking-tight text-[var(--playarg-foreground)]">通知</h1>
        <button id="btn-mark-all" class="rounded-md border border-[var(--playarg-border)] px-3 py-1.5 text-xs text-[var(--playarg-muted-foreground)] transition-colors hover:border-[var(--playarg-primary)] hover:text-[var(--playarg-primary)]">全部已读</button>

        <div class="rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-muted-foreground)]">加载中…</div>

<!-- Footer -->
<footer class="ml-56 border-t border-[var(--playarg-border)] bg-[var(--playarg-card)] py-6">
  <div class="px-8 text-xs text-[var(--playarg-muted-foreground)]">
    PlayARG © 2026
  </div>
</footer>

<script src="/auth.js"></script>
<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function formatDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function adminTag(n) {
    if (n.sourceIsOwner) return '<span class="ml-1.5 rounded bg-[var(--playarg-accent-purple)]/20 px-1.5 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">站主</span>';
    if (n.sourceRole === 'admin') return '<span class="ml-1.5 rounded bg-[var(--playarg-accent-purple)]/20 px-1.5 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">' + escapeHtml(n.sourceAdminBadgeText || '管理员') + '</span>';
    return '';
  }
  function sourceNameClass(n) {
    return (n.sourceRole === 'admin' || n.sourceIsOwner) ? 'text-[var(--playarg-accent-purple)]' : 'text-[var(--playarg-primary)]';
  }

  function renderList(list) {
    var el = document.getElementById('notifications-list');
    if (!list.length) {
      el.innerHTML = '<div class="rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-muted-foreground)]">暂无通知</div>';
      return;
    }
    el.innerHTML = list.map(function (n) {
      var place = n.contextType === 'feed' ? '犇犇' : '讨论区';
      var unreadClass = n.read ? 'opacity-70' : 'border-l-2 border-[var(--playarg-primary)] bg-[var(--playarg-primary-dim)]';
      return '<a href="' + escapeHtml(n.link || '#') + '" data-id="' + escapeHtml(String(n.id)) + '" class="notification-item block rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-4 transition-colors hover:border-[var(--playarg-primary)]/30 ' + unreadClass + '">' +
        '<div class="mb-1 flex items-center justify-between text-sm">' +
          '<span class="font-medium text-[var(--playarg-foreground)]">用户 <span class="' + sourceNameClass(n) + '">' + escapeHtml(n.sourceUsername) + adminTag(n) + '</span> 提到了你</span>' +
          '<span class="text-xs text-[var(--playarg-muted-foreground)]">' + escapeHtml(formatDateTime(n.createdAt)) + '</span>' +
        '</div>' +
        '<div class="text-sm text-[var(--playarg-muted-foreground)]">' +
          '<span class="' + sourceNameClass(n) + ' hover:underline">' + escapeHtml(n.sourceUsername) + adminTag(n) + '</span> 在' + place + '中提到了你，快去看看吧！' +
        '</div>' +
      '</a>';
    }).join('');
    document.querySelectorAll('.notification-item').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var id = a.getAttribute('data-id');
        fetch('/api/notifications', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'mark-read', id: id }) });
      });
    });
  }

  function load() {
    fetch('/api/notifications', { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json.ok) renderList(json.data || []);
        else document.getElementById('notifications-list').innerHTML = '<div class="rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-state-error)]">' + escapeHtml(json.error || '加载失败') + '</div>';
      })
      .catch(function (err) {
        console.error('[notifications]', err);
        document.getElementById('notifications-list').innerHTML = '<div class="rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-state-error)]">加载失败</div>';
      });
  }

  document.getElementById('btn-mark-all').addEventListener('click', function () {
    fetch('/api/notifications', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'mark-read' }) })
      .then(function () { load(); });
  });

  load();
})();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
