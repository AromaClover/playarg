    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

      (function() {
        try {
          var t = localStorage.getItem('playarg_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');

<body class="min-h-screen font-sans antialiased">
<!-- Top navigation -->
<header class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-[var(--playarg-border)] bg-[var(--playarg-background)]/90 backdrop-blur">
  <div class="flex h-full items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <a href="/" data-dom-id="nav-logo" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-[var(--playarg-primary)] glow-text">

    </div>
        <nav class="flex items-center gap-4">

<!-- Main content frame -->
<main id="main-content" class="ml-56 min-h-screen bg-[var(--playarg-background)] pt-16">
  <div class="p-8">
    <!-- Page header -->
    <section class="mb-6 rounded-xl border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-6">
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
          <h1 id="problem-title" class="text-2xl font-semibold tracking-tight text-[var(--playarg-foreground)]">加载中…</h1>
          <p id="problem-source" class="mt-1 text-sm text-[var(--playarg-muted-foreground)]">来源：-</p>

        <div class="flex flex-wrap items-center gap-3">
          <span id="problem-difficulty" class="inline-flex items-center rounded-full border border-[var(--playarg-border)] bg-[var(--playarg-muted)] px-3 py-1 text-xs font-medium text-[var(--playarg-foreground)]">
            <i data-lucide="gauge" class="mr-1.5 h-3.5 w-3.5 text-[var(--playarg-primary)]"></i>
            Level -
          </span>
          <span id="problem-time" class="inline-flex items-center rounded-full border border-[var(--playarg-border)] bg-[var(--playarg-muted)] px-3 py-1 text-xs font-medium text-[var(--playarg-muted-foreground)]">
            <i data-lucide="clock" class="mr-1.5 h-3.5 w-3.5"></i>
            时间限制：-
          </span>
          <span id="problem-memory" class="inline-flex items-center rounded-full border border-[var(--playarg-border)] bg-[var(--playarg-muted)] px-3 py-1 text-xs font-medium text-[var(--playarg-muted-foreground)]">
            <i data-lucide="hard-drive" class="mr-1.5 h-3.5 w-3.5"></i>
            内存限制：-
          </span>
        </div>
      </div>
    </section>

    <!-- Tabs -->
    <div class="mb-6 border-b border-[var(--playarg-border)]">
      <nav class="flex gap-1" aria-label="题目选项卡">
        <button data-dom-id="tab-statement" class="group relative flex items-center gap-2 border-b-2 border-[var(--playarg-primary)] px-4 py-3 text-sm font-medium text-[var(--playarg-primary)]">
          <i data-lucide="file-text" class="h-4 w-4"></i>
          题面
        </button>
        <button data-dom-id="tab-submissions" class="group relative flex items-center gap-2 border-b-2 border-transparent px-4 py-3 text-sm font-medium text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-foreground)]">
          <i data-lucide="terminal" class="h-4 w-4"></i>
          提交记录
        </button>
      </nav>
    </div>

    <!-- Two-column layout -->
    <div class="grid grid-cols-1 gap-6 xl:grid-cols-[1fr_380px]">
      <!-- Left: problem statement -->
      <section class="rounded-xl border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-6">
        <article class="prose prose-invert max-w-none">
          <h2 class="mb-3 flex items-center gap-2 text-lg font-semibold text-[var(--playarg-foreground)]">
            <i data-lucide="align-left" class="h-5 w-5 text-[var(--playarg-primary)]"></i>
            题目简介
          </h2>
          <div id="problem-description" class="mb-6 whitespace-pre-wrap text-sm leading-7 text-[var(--playarg-card-foreground)]">
            加载中…
          </div>

          <div id="problem-attachments-wrap" class="hidden">
            <h2 class="mb-3 flex items-center gap-2 text-lg font-semibold text-[var(--playarg-foreground)]">
              <i data-lucide="paperclip" class="h-5 w-5 text-[var(--playarg-primary)]"></i>

            </h2>
            <div id="problem-attachments" class="flex flex-col gap-2"></div>
          </div>
        </article>
      </section>

      <!-- Right: answer submission -->
      <aside class="flex flex-col gap-4">
        <div class="rounded-xl border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-4">
          <label for="answer-input" class="mb-2 block text-xs font-medium text-[var(--playarg-muted-foreground)]">
            <i data-lucide="key" class="mr-1 inline h-3.5 w-3.5"></i>提交答案

          <button id="btn-submit-answer" class="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-lg bg-[var(--playarg-primary)] px-4 py-2.5 text-sm font-medium text-[var(--playarg-primary-foreground)] transition-all hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-[var(--playarg-ring)]">
            <i data-lucide="send" class="h-4 w-4"></i>
            提交答案
          </button>
          <div id="answer-result" class="mt-3 hidden rounded-lg border px-3 py-2 text-sm"></div>
        </div>

        <div class="flex flex-1 flex-col rounded-xl border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-4">
          <div class="mb-3 flex items-center justify-between">
            <span class="text-xs font-medium text-[var(--playarg-muted-foreground)]">
              <i data-lucide="history" class="mr-1 inline h-3.5 w-3.5"></i>我的提交
            </span>
          </div>
          <div id="my-submissions" class="flex flex-col gap-2 text-sm">
            <div class="text-center text-xs text-[var(--playarg-muted-foreground)]">加载中…</div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="ml-56 border-t border-[var(--playarg-border)] bg-[var(--playarg-card)] py-6">
  <div class="px-8 text-xs text-[var(--playarg-muted-foreground)]">
    PlayARG © 2026
  </div>
</footer>

<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var DIFFICULTY_MAP = {
    l1: { label: 'Level 1', class: 'text-[#f43f5e]' },
    l2: { label: 'Level 2', class: 'text-[#f97316]' },
    l3: { label: 'Level 3', class: 'text-[#eab308]' },
    l4: { label: 'Level 4', class: 'text-[#22c55e]' },
    l5: { label: 'Level 5', class: 'text-[#14b8a6]' },
    l6: { label: 'Level 6', class: 'text-[#3b82f6]' },
    l7: { label: 'Level 7', class: 'text-[#a855f7]' }
  };
  var params = new URLSearchParams(location.search);
  var id = params.get('id');

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text == null ? '' : text;
  }
  function setHtml(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }
  function renderSamples(samples) {
    if (!Array.isArray(samples) || !samples.length) return '<div class="text-sm text-[var(--playarg-muted-foreground)]">暂无样例</div>';
    return samples.map(function (s, idx) {
      var input = String(s.input || '');
      var output = String(s.output || '');
      return '<div class="mb-4">' +
        '<div class="mb-2 flex items-center justify-between">' +
          '<span class="text-xs font-medium text-[var(--playarg-muted-foreground)]">输入 #' + (idx + 1) + '</span>' +
        '</div>' +
        '<pre class="mb-3 overflow-x-auto rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-code-bg)] p-4 text-sm leading-6 text-[var(--playarg-code-fg)]"><code>' + escapeHtml(input) + '</code></pre>' +
        '<div class="mb-2 flex items-center justify-between">' +
          '<span class="text-xs font-medium text-[var(--playarg-muted-foreground)]">输出 #' + (idx + 1) + '</span>' +
        '</div>' +
        '<pre class="overflow-x-auto rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-code-bg)] p-4 text-sm leading-6 text-[var(--playarg-code-fg)]"><code>' + escapeHtml(output) + '</code></pre>' +
      '</div>';
    }).join('');
  }
  function applyDifficulty(difficulty) {
    var cfg = DIFFICULTY_MAP[String(difficulty || '').toLowerCase()] || { label: difficulty || '未知', class: '' };
    var el = document.getElementById('problem-difficulty');
    if (el) el.innerHTML = '<i data-lucide="gauge" class="mr-1.5 h-3.5 w-3.5 text-[var(--playarg-primary)]"></i>' + escapeHtml(cfg.label);
  }
  function renderError(message) {
    setHtml('problem-description', '<span class="text-[var(--playarg-state-error)]">' + escapeHtml(message) + '</span>');
    var wrap = document.getElementById('problem-attachments-wrap');
    if (wrap) wrap.classList.add('hidden');
  }

  function renderAttachments(list) {
    var wrap = document.getElementById('problem-attachments-wrap');
    var el = document.getElementById('problem-attachments');
    if (!wrap || !el) return;
    var items = Array.isArray(list) ? list : [];
    if (!items.length) { wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    el.innerHTML = items.map(function (a) {
      return '<a href="' + escapeHtml(a.url) + '" target="_blank" rel="noopener" download class="flex items-center justify-between rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-background)] px-4 py-3 transition-colors hover:border-[var(--playarg-primary)]/30">' +
        '<div class="flex items-center gap-3 min-w-0">' +
          '<i data-lucide="download" class="h-4 w-4 shrink-0 text-[var(--playarg-primary)]"></i>' +
          '<span class="truncate text-sm text-[var(--playarg-foreground)]">' + escapeHtml(a.name || '附件') + '</span>' +
        '</div>' +
        '<span class="ml-3 shrink-0 text-xs text-[var(--playarg-muted-foreground)]">下载</span>' +
      '</a>';
    }).join('');
  }

  function formatTime(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function renderSubmissions(list) {
    var el = document.getElementById('my-submissions');
    if (!el) return;
    if (!Array.isArray(list) || !list.length) {
      el.innerHTML = '<div class="text-center text-xs text-[var(--playarg-muted-foreground)]">暂无提交记录</div>';
      return;
    }
    el.innerHTML = list.map(function (s) {
      var accepted = s.status === 'accepted';
      var statusText = accepted ? '正确' : '错误';
      var statusClass = accepted ? 'text-[var(--playarg-state-success)]' : 'text-[var(--playarg-state-error)]';
      return '<div class="flex items-center justify-between rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-background)] px-3 py-2">' +
        '<div class="min-w-0 flex-1">' +
          '<div class="truncate text-sm text-[var(--playarg-foreground)]">' + escapeHtml(s.answer || '') + '</div>' +
          '<div class="text-xs text-[var(--playarg-muted-foreground)]">' + formatTime(s.createdAt) + '</div>' +
        '</div>' +
        '<span class="ml-2 text-xs font-medium ' + statusClass + '">' + statusText + '</span>' +
      '</div>';
    }).join('');
  }

  function loadMySubmissions() {
    if (!id) return;
    fetch('/api/submissions?problemId=' + encodeURIComponent(id), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json && json.ok) renderSubmissions(json.data);
        else renderSubmissions([]);
      })
      .catch(function () { renderSubmissions([]); });
  }

  function bindAnswerSubmit() {
    var btn = document.getElementById('btn-submit-answer');
    var input = document.getElementById('answer-input');
    var result = document.getElementById('answer-result');
    if (!btn || !input) return;
    btn.addEventListener('click', function () {
      var answer = input.value.trim();
      if (!answer) { input.focus(); return; }
      btn.disabled = true;
      btn.classList.add('opacity-60');
      fetch('/api/submit', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ problemId: id, answer: answer })
      })
        .then(function (res) { return res.json(); })
        .then(function (json) {
          btn.disabled = false;
          btn.classList.remove('opacity-60');
          if (json && json.ok) {
            var accepted = json.data.status === 'accepted';
            result.classList.remove('hidden');
            result.className = 'mt-3 rounded-lg border px-3 py-2 text-sm ' + (accepted ? 'border-[var(--playarg-state-success)]/30 bg-[var(--playarg-state-success)]/10 text-[var(--playarg-state-success)]' : 'border-[var(--playarg-state-error)]/30 bg-[var(--playarg-state-error)]/10 text-[var(--playarg-state-error)]');
            result.textContent = accepted ? '答案正确！' : '答案错误，请再试一次。';
            input.value = '';
            loadMySubmissions();
          } else {
            result.classList.remove('hidden');
            result.className = 'mt-3 rounded-lg border border-[var(--playarg-state-error)]/30 bg-[var(--playarg-state-error)]/10 px-3 py-2 text-sm text-[var(--playarg-state-error)]';
            result.textContent = (json && json.error) || '提交失败';
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.classList.remove('opacity-60');
          result.classList.remove('hidden');
          result.className = 'mt-3 rounded-lg border border-[var(--playarg-state-error)]/30 bg-[var(--playarg-state-error)]/10 px-3 py-2 text-sm text-[var(--playarg-state-error)]';
          result.textContent = '网络错误';
        });
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') btn.click();
    });
  }

  function loadProblem() {
    if (!id) {
      renderError('缺少题目 ID');
      return;
    }
    fetch('/api/data?type=problems&id=' + encodeURIComponent(id), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        var p = (json && json.data) || null;
        if (!p || !p.id) { renderError('题目不存在或已被删除'); return; }
        document.title = escapeHtml(p.id + ' ' + (p.title || '')) + ' - PlayARG';
        setText('problem-title', p.id + ' ' + (p.title || ''));
        setText('problem-source', '来源：' + (p.source || '-'));
        applyDifficulty(p.difficulty);
        setText('problem-time', '时间限制：' + (p.timeLimit || p.time_limit || '1 s'));
        setText('problem-memory', '内存限制：' + (p.memoryLimit || p.memory_limit || '128 MB'));
        setText('problem-description', p.description || '暂无描述');
        renderAttachments(p.attachments);
        if (typeof lucide !== 'undefined') lucide.createIcons();
      })
      .catch(function (err) {
        console.error('[problem-detail]', err);
        renderError('加载失败，请稍后重试');
      });
  }
  loadProblem();
  loadMySubmissions();
  bindAnswerSubmit();
})();
</script>
</body>
</html>
