    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* 设置页特有样式 */
      .setting-page-title {
        font-size: 28px;
        font-weight: 700;
        color: var(--playarg-foreground);
        margin-bottom: 24px;
      }

      .setting-tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--playarg-border);
        margin-bottom: 24px;
      }
      .setting-tab {
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        color: var(--playarg-muted-foreground);
        cursor: pointer;
        border: none;
        background: none;
        position: relative;
        margin-bottom: -1px;
        transition: color 0.2s;
      }
      .setting-tab:hover {
        color: var(--playarg-foreground);
      }
      .setting-tab.active {
        color: var(--playarg-primary);
      }
      .setting-tab.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--playarg-primary);
      }

      .setting-card {
        background: var(--playarg-card);
        border: 1px solid var(--playarg-border);
        border-radius: var(--playarg-radius-large);
        padding: 24px;
      }

      .setting-row {
        display: flex;
        align-items: center;
        padding: 18px 0;
        border-bottom: 1px solid var(--playarg-border);
      }
      .setting-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .setting-row:first-child {
        padding-top: 0;
      }

      .setting-label {
        width: 140px;
        flex-shrink: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--playarg-foreground);
      }

      .setting-content {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* 头像区域 */
      .avatar-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .setting-avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--playarg-primary), var(--playarg-accent-purple));
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: var(--shadow-2);
      }
      .setting-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .setting-avatar svg {
        width: 40px;
        height: 40px;
        color: var(--playarg-primary-foreground);
      }

      .btn-setting {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: 500;
        border-radius: var(--playarg-radius-small);
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
      }
      .btn-setting-primary {
        background: var(--playarg-primary);
        color: var(--playarg-primary-foreground);
      }
      .btn-setting-primary:hover {
        filter: brightness(1.1);
      }
      .btn-setting-danger {
        background: var(--playarg-state-error);
        color: #fff;
      }
      .btn-setting-danger:hover {
        filter: brightness(1.1);
      }
      .btn-setting:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .avatar-hint {
        font-size: 12px;
        color: var(--playarg-muted-foreground);
        text-align: center;
      }

      /* 注销账户 */
      .delete-account-desc {
        font-size: 13px;
        color: var(--playarg-muted-foreground);
      }
      .delete-account-desc a {
        color: var(--playarg-primary);
        text-decoration: none;
      }
      .delete-account-desc a:hover {
        text-decoration: underline;
      }

      /* 模态框（深色主题） */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
      }
      .modal-overlay.active {
        display: flex;
      }
      .setting-modal {
        background: var(--playarg-card);
        border: 1px solid var(--playarg-border);
        border-radius: var(--playarg-radius-large);
        padding: 24px;
        width: 100%;
        max-width: 400px;
        box-shadow: var(--shadow-3);
      }
      .modal-title {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px;
        color: var(--playarg-foreground);
      }
      .modal-desc {
        font-size: 13px;
        color: var(--playarg-muted-foreground);
        margin-bottom: 16px;
        line-height: 1.6;
      }
      .modal-input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        font-size: 13px;
        border: 1px solid var(--playarg-border);
        border-radius: var(--playarg-radius-small);
        background: var(--playarg-background);
        color: var(--playarg-foreground);
        margin-bottom: 12px;
        transition: border-color 0.2s;
      }
      .modal-input:focus {
        outline: none;
        border-color: var(--playarg-primary);
        box-shadow: 0 0 0 2px var(--playarg-ring);
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
      }
      .btn-modal-ghost {
        background: transparent;
        color: var(--playarg-muted-foreground);
        border: 1px solid var(--playarg-border);
      }
      .btn-modal-ghost:hover {
        background: var(--playarg-muted);
        color: var(--playarg-foreground);
      }

      /* Toast */
      .setting-toast {
        position: fixed;
        top: 80px;
        right: 24px;
        padding: 10px 18px;
        border-radius: var(--playarg-radius-medium);
        font-size: 13px;
        font-weight: 500;
        z-index: 2000;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
        border: 1px solid;
      }
      .setting-toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .setting-toast.success {
        background: rgba(34, 197, 94, 0.1);
        color: #22c55e;
        border-color: rgba(34, 197, 94, 0.3);
      }
      .setting-toast.error {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.3);
      }

      @media (max-width: 768px) {
        .setting-row { flex-direction: column; align-items: flex-start; gap: 12px; }
        .setting-label { width: auto; }
        .setting-content { width: 100%; flex-wrap: wrap; }
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('playarg_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
</head>

    PlayARG © 2026

<!-- 修改用户名弹窗 -->
<div class="modal-overlay" id="modal-username">
  <div class="setting-modal">
    <h3 class="modal-title">修改用户名</h3>
    <p class="modal-desc">请输入新的用户名（3-20 个字符，支持字母、数字、下划线、中文）。</p>
    <input type="text" class="modal-input" id="input-new-username" placeholder="新用户名" maxlength="20">
    <div class="modal-actions">
      <button class="btn-setting btn-modal-ghost" data-close="modal-username">取消</button>
      <button class="btn-setting btn-setting-danger" id="btn-confirm-username">确认修改</button>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-overlay" id="modal-password">
  <div class="setting-modal">
    <h3 class="modal-title">修改密码</h3>
    <p class="modal-desc">请输入当前密码和新密码（至少 6 位）。</p>
    <input type="password" class="modal-input" id="input-current-password" placeholder="当前密码">
    <input type="password" class="modal-input" id="input-new-password" placeholder="新密码">
    <input type="password" class="modal-input" id="input-confirm-password" placeholder="确认新密码">
    <div class="modal-actions">
      <button class="btn-setting btn-modal-ghost" data-close="modal-password">取消</button>
      <button class="btn-setting btn-setting-danger" id="btn-confirm-password">确认修改</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="setting-toast" id="setting-toast"></div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    lucide.createIcons();
  });
</script>
<script>
(function () {
  'use strict';

  // Tab 切换
  var tabs = document.querySelectorAll('.setting-tab[data-tab]');
  var panels = document.querySelectorAll('.tab-panel');

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      var target = tab.getAttribute('data-tab');
      if (!target) return;

      tabs.forEach(function (t) {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');

      panels.forEach(function (p) {
        p.style.display = 'none';
      });
      var targetPanel = document.getElementById('panel-' + target);
      if (targetPanel) targetPanel.style.display = 'block';
    });
  });

  // Toast
  function showToast(msg, type) {
    var toast = document.getElementById('setting-toast');
    toast.textContent = msg;
    toast.className = 'setting-toast ' + (type || 'success');
    toast.classList.add('show');
    setTimeout(function () {
      toast.classList.remove('show');
    }, 2500);
  }

  // 模态框控制
  function openModal(id) {
    var m = document.getElementById(id);
    if (m) m.classList.add('active');
  }
  function closeModal(id) {
    var m = document.getElementById(id);
    if (m) m.classList.remove('active');
  }
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      closeModal(btn.getAttribute('data-close'));
    });
  });
  document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.classList.remove('active');
    });
  });

  // 获取当前用户
  function getCurrentUser() {
    try {
      var raw = localStorage.getItem('playarg_user');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // 检查登录状态
  var currentUser = getCurrentUser();
  if (!currentUser) {
    window.location.href = '/';
    return;
  }

  // 渲染头像
  function renderAvatar() {
    var preview = document.getElementById('avatar-preview');
    if (!preview) return;
    if (currentUser && currentUser.avatar) {
      preview.innerHTML = '<img src="' + currentUser.avatar + '" alt="头像">';
    }
  }
  renderAvatar();

  // 头像上传
  var avatarInput = document.getElementById('avatar-input');
  var btnAvatar = document.getElementById('btn-avatar');
  if (btnAvatar && avatarInput) {
    btnAvatar.addEventListener('click', function () { avatarInput.click(); });
    avatarInput.addEventListener('change', function () {
      var file = avatarInput.files[0];
      if (!file) return;
      if (file.size > 500 * 1024) {
        showToast('图片太大，请压缩到 500KB 以下', 'error');
        return;
      }
      var reader = new FileReader();
      reader.onload = function (e) {
        var dataUrl = e.target.result;
        if (!String(dataUrl).startsWith('data:image/')) {
          showToast('只能上传图片', 'error');
          return;
        }
        fetch('/api/avatar', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ avatar: dataUrl })
        })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            if (json.ok) {
              currentUser.avatar = json.data.avatar;
              localStorage.setItem('playarg_user', JSON.stringify(currentUser));
              renderAvatar();
              showToast('头像上传成功', 'success');
            } else {
              showToast(json.error || '上传失败', 'error');
            }
          })
          .catch(function () { showToast('网络错误', 'error'); });
      };
      reader.readAsDataURL(file);
    });
  }

  // 修改用户名
  var btnChangeUsername = document.getElementById('btn-change-username');
  if (btnChangeUsername) {
    btnChangeUsername.addEventListener('click', function () {
      document.getElementById('input-new-username').value = currentUser.username || '';
      openModal('modal-username');
    });
  }
  var btnConfirmUsername = document.getElementById('btn-confirm-username');
  if (btnConfirmUsername) {
    btnConfirmUsername.addEventListener('click', function () {
      var newName = document.getElementById('input-new-username').value.trim();
      if (!newName) { showToast('用户名不能为空', 'error'); return; }
      if (newName.length < 3 || newName.length > 20) {
        showToast('用户名长度需在 3-20 个字符之间', 'error');
        return;
      }
      btnConfirmUsername.disabled = true;
      fetch('/api/me', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'change-username', username: newName })
      })
        .then(function (res) { return res.json(); })
        .then(function (json) {
          btnConfirmUsername.disabled = false;
          if (json.ok) {
            currentUser.username = newName;
            localStorage.setItem('playarg_user', JSON.stringify(currentUser));
            closeModal('modal-username');
            showToast('用户名修改成功', 'success');
          } else {
            showToast(json.error || '修改失败', 'error');
          }
        })
        .catch(function () {
          btnConfirmUsername.disabled = false;
          showToast('网络错误', 'error');
        });
    });
  }

  // 修改密码
  var btnChangePassword = document.getElementById('btn-change-password');
  if (btnChangePassword) {
    btnChangePassword.addEventListener('click', function () {
      document.getElementById('input-current-password').value = '';
      document.getElementById('input-new-password').value = '';
      document.getElementById('input-confirm-password').value = '';
      openModal('modal-password');
    });
  }
  var btnConfirmPassword = document.getElementById('btn-confirm-password');
  if (btnConfirmPassword) {
    btnConfirmPassword.addEventListener('click', function () {
      var currentPwd = document.getElementById('input-current-password').value;
      var newPwd = document.getElementById('input-new-password').value;
      var confirmPwd = document.getElementById('input-confirm-password').value;

      if (!currentPwd) { showToast('请输入当前密码', 'error'); return; }
      if (!newPwd || newPwd.length < 6) { showToast('新密码至少 6 位', 'error'); return; }
      if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }

      btnConfirmPassword.disabled = true;
      fetch('/api/me', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'change-password', currentPassword: currentPwd, newPassword: newPwd })
      })
        .then(function (res) { return res.json(); })
        .then(function (json) {
          btnConfirmPassword.disabled = false;
          if (json.ok) {
            closeModal('modal-password');
            showToast('密码修改成功', 'success');
          } else {
            showToast(json.error || '修改失败', 'error');
          }
        })
        .catch(function () {
          btnConfirmPassword.disabled = false;
          showToast('网络错误', 'error');
        });
    });
  }

})();
</script>
<script src="/auth.js"></script>

</body>
