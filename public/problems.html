    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

    </style>

      .no-scrollbar::-webkit-scrollbar { display: none; }

        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;

    <script>
      (function() {
        try {
          var t = localStorage.getItem('playarg_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();

<body class="min-h-screen font-sans antialiased">
<!-- Top navigation -->
<header class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-[var(--playarg-border)] bg-[var(--playarg-background)]/90 backdrop-blur">

        <nav class="flex items-center gap-4">

  </div>
</main>

<!-- Footer -->
<footer class="ml-56 border-t border-[var(--playarg-border)] bg-[var(--playarg-card)] py-6">
  <div class="px-8 text-xs text-[var(--playarg-muted-foreground)]">
    PlayARG © 2026
  </div>
</footer>

<script src="/auth.js"></script>
<script>lucide.createIcons();</script>
<script>
(function () {
  const STATUS_MAP = {
    solved: { icon: 'check-circle-2', color: 'text-[var(--playarg-state-success)]' },
    attempted: { icon: 'clock', color: 'text-[var(--playarg-state-warning)]' },
    unsolved: { icon: 'circle', color: 'text-[var(--playarg-muted-foreground)]' }
  };
  const DIFFICULTY_MAP = {
    l1: { label: 'Level 1', class: 'tag-l1' },
    l2: { label: 'Level 2', class: 'tag-l2' },
    l3: { label: 'Level 3', class: 'tag-l3' },
    l4: { label: 'Level 4', class: 'tag-l4' },
    l5: { label: 'Level 5', class: 'tag-l5' },
    l6: { label: 'Level 6', class: 'tag-l6' },
    l7: { label: 'Level 7', class: 'tag-l7' }
  };

  function normalize(raw) {
    const p = raw || {};
    const status = String(p.status || p.state || 'unsolved').toLowerCase();
    const difficulty = String(p.difficulty || p.level || '').toLowerCase();
    const passRate = p.passRate ?? p.pass_rate ?? p.acRate ?? p.ac_rate ?? p.rate ?? null;
    const submissions = p.submissions ?? p.submitCount ?? p.submit_count ?? p.count ?? null;
    return {
      status,
      id: p.id ?? p.problemId ?? p.problem_id ?? p.pid ?? '',
      title: p.title ?? p.name ?? '未命名题目',
      difficulty,
      passRate: passRate === null ? null : Number(passRate),
      submissions: submissions === null ? null : Number(submissions)
    };
  }

  function formatNumber(n) {
    if (n === null || Number.isNaN(n)) return '-';
    return n.toLocaleString('zh-CN');
  }

  function formatPassRate(rate) {
    if (rate === null || Number.isNaN(rate)) return '-';
    const value = rate > 1 ? rate : rate * 100;
    return value.toFixed(1) + '%';
  }

  function passRateColor(rate) {
    if (rate === null || Number.isNaN(rate)) return 'text-[var(--playarg-muted-foreground)]';
    const value = rate > 1 ? rate : rate * 100;
    if (value >= 70) return 'text-[var(--playarg-state-success)]';
    if (value >= 40) return 'text-[var(--playarg-state-warning)]';
    return 'text-[var(--playarg-state-error)]';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderRow(p) {
    const statusCfg = STATUS_MAP[p.status] || STATUS_MAP.unsolved;
    const diffCfg = DIFFICULTY_MAP[p.difficulty] || { label: p.difficulty || '未知', class: 'tag-l1' };
    const tr = document.createElement('tr');
    tr.className = 'transition-colors hover:bg-[var(--playarg-muted)]/50';
    tr.innerHTML =
      '<td class="px-5 py-3.5"><i data-lucide="' + statusCfg.icon + '" class="h-5 w-5 ' + statusCfg.color + '"></i></td>' +
      '<td class="px-5 py-3.5 font-mono text-[var(--playarg-muted-foreground)]">' + escapeHtml(p.id) + '</td>' +
      '<td class="px-5 py-3.5"><a href="/problem-detail?id=' + encodeURIComponent(p.id) + '" class="font-medium text-[var(--playarg-foreground)] hover:text-[var(--playarg-primary)] hover:underline">' + escapeHtml(p.title) + '</a></td>' +
      '<td class="px-5 py-3.5"><span class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-medium ' + diffCfg.class + '">' + escapeHtml(diffCfg.label) + '</span></td>' +
      '<td class="px-5 py-3.5"><span class="' + passRateColor(p.passRate) + '">' + formatPassRate(p.passRate) + '</span></td>' +
      '<td class="px-5 py-3.5 text-right font-mono text-[var(--playarg-muted-foreground)]">' + formatNumber(p.submissions) + '</td>';
    return tr;
  }

  function renderEmpty() {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="6" class="px-5 py-8 text-center text-sm text-[var(--playarg-muted-foreground)]">暂无题目</td>';
    return tr;
  }

  async function load() {
    const tbody = document.querySelector('table[data-dom-id="table-problems"] tbody');
    if (!tbody) return;
    try {
      const res = await fetch('/api/data?type=problems');
      const json = await res.json();
      const problems = Array.isArray(json) ? json : (json.data || []);
      tbody.innerHTML = '';
      if (problems.length === 0) {
        tbody.appendChild(renderEmpty());
      } else {
        const fragment = document.createDocumentFragment();
        problems.map(normalize).forEach(function (p) { fragment.appendChild(renderRow(p)); });
        tbody.appendChild(fragment);
      }
      if (window.lucide && lucide.createIcons) {
        lucide.createIcons();
      }
    } catch (err) {
      tbody.innerHTML = '';
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="6" class="px-5 py-8 text-center text-sm text-[var(--playarg-state-error)]">加载失败，请稍后重试</td>';
      tbody.appendChild(tr);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', load);
  } else {
    load();
  }
})();
</script>
</body>
</html>
