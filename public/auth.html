<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <title>解锁账户 - PlayARG</title>
    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-card {
  width: 100%;
  max-width: 460px;
  background: var(--playarg-card);
  border: 1px solid var(--playarg-border);
  border-radius: var(--playarg-radius-large);
  padding: 40px 36px;
  box-shadow: var(--shadow-3);
}

.auth-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
}
.auth-logo img {
  width: 44px;
  height: 44px;
  border-radius: 8px;
}
.auth-logo span {
  font-size: 30px;
  font-weight: 700;
  color: var(--playarg-primary);
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.auth-title {
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 12px;
  color: var(--playarg-foreground);
}

.auth-desc {
  text-align: center;
  font-size: 15px;
  color: var(--playarg-muted-foreground);
  line-height: 1.7;
  margin-bottom: 28px;
}

.auth-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 600;
  color: var(--playarg-foreground);
  margin-bottom: 10px;
}
.auth-section-title svg {
  width: 24px;
  height: 24px;
  color: var(--playarg-primary);
}

.auth-hint {
  font-size: 14px;
  color: var(--playarg-muted-foreground);
  margin-bottom: 16px;
  line-height: 1.6;
}
.auth-hint .username {
  color: var(--playarg-foreground);
  font-weight: 600;
  font-family: var(--font-mono);
}

.auth-input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  font-size: 15px;
  border: 1px solid var(--playarg-border);
  border-radius: var(--playarg-radius-small);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
  margin-bottom: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.auth-input:focus {
  outline: none;
  border-color: var(--playarg-primary);
  box-shadow: 0 0 0 3px var(--playarg-ring);
}

.auth-btn {
  width: 100%;
  height: 46px;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: var(--playarg-radius-small);
  cursor: pointer;
  transition: filter 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.auth-btn:hover { filter: brightness(1.1); }
.auth-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }

.auth-btn-primary {
  background: var(--playarg-primary);
  color: var(--playarg-primary-foreground);
}

.auth-btn-success {
  background: var(--playarg-state-success);
  color: #030507;
}

.auth-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  font-size: 14px;
}
.auth-footer a {
  color: var(--playarg-primary);
  text-decoration: none;
  transition: opacity 0.2s;
}
.auth-footer a:hover { opacity: 0.8; text-decoration: underline; }

.auth-error {
  padding: 10px 14px;
  border-radius: var(--playarg-radius-small);
  font-size: 13px;
  margin-bottom: 14px;
  background: rgba(239, 68, 68, 0.1);
  color: #ef4444;
  border: 1px solid rgba(239, 68, 68, 0.3);
  display: none;
}
.auth-error.show { display: block; }

/* 成功后的修改表单 */
.auth-form-section {
  display: none;
}
.auth-form-section.active { display: block; }

.auth-form-section h3 {
  font-size: 20px;
  font-weight: 600;
  margin: 0 0 16px;
  color: var(--playarg-foreground);
  display: flex;
  align-items: center;
  gap: 8px;
}
.auth-form-section h3 svg {
  width: 22px;
  height: 22px;
  color: var(--playarg-state-success);
}

.auth-form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--playarg-muted-foreground);
  margin-bottom: 6px;
}

.auth-back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--playarg-muted-foreground);
  text-decoration: none;
  margin-bottom: 16px;
  transition: color 0.2s;
}
.auth-back:hover { color: var(--playarg-primary); }

@media (max-width: 480px) {
  .auth-card { padding: 28px 20px; }
  .auth-title { font-size: 22px; }
  .auth-logo span { font-size: 24px; }
}
    </style>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<div class="auth-card">
  <!-- 解锁账户视图 -->
  <div id="view-unlock">
    <div class="auth-logo">
      <img src="/assets/logo.png" alt="PlayARG">
      <span>PlayARG</span>
    </div>

    <h1 class="auth-title">解锁账户</h1>
    <p class="auth-desc">您的账户正在进行敏感操作，请解锁您的账户以保证操作安全。</p>

    <div class="auth-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      使用账户密码解锁
    </div>

    <p class="auth-hint">请输入账号 <span class="username" id="unlock-username">—</span> 对应的密码进行解锁</p>

    <div class="auth-error" id="unlock-error"></div>

    <input type="password" class="auth-input" id="unlock-password" placeholder="请输入密码" autocomplete="current-password">

    <button class="auth-btn auth-btn-primary" id="btn-unlock">
      使用账户密码解锁
    </button>

    <div class="auth-footer">
      <a href="#" id="btn-logout">登出</a>
      <a href="/">返回首页</a>
    </div>
  </div>

  <!-- 修改用户名视图 -->
  <div id="view-username" class="auth-form-section">
    <a href="/user/setting" class="auth-back">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      返回设置
    </a>

    <div class="auth-logo">
      <img src="/assets/logo.png" alt="PlayARG">
      <span>PlayARG</span>
    </div>

    <h3>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      修改用户名
    </h3>

    <label class="auth-form-label">当前用户名</label>
    <input type="text" class="auth-input" id="current-username-display" disabled style="opacity: 0.6; margin-bottom: 14px;">

    <label class="auth-form-label">新用户名</label>
    <input type="text" class="auth-input" id="new-username-input" placeholder="请输入新用户名（3-20 个字符）" maxlength="20">

    <div class="auth-error" id="username-error"></div>

    <button class="auth-btn auth-btn-primary" id="btn-save-username">
      确认修改
    </button>
  </div>

  <!-- 修改密码视图 -->
  <div id="view-password" class="auth-form-section">
    <a href="/user/setting" class="auth-back">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      返回设置
    </a>

    <div class="auth-logo">
      <img src="/assets/logo.png" alt="PlayARG">
      <span>PlayARG</span>
    </div>

    <h3>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      修改密码
    </h3>

    <label class="auth-form-label">新密码</label>
    <input type="password" class="auth-input" id="new-password-input" placeholder="请输入新密码（至少 6 位）" autocomplete="new-password">

    <label class="auth-form-label">确认新密码</label>
    <input type="password" class="auth-input" id="confirm-password-input" placeholder="请再次输入新密码" autocomplete="new-password">

    <div class="auth-error" id="password-error"></div>

    <button class="auth-btn auth-btn-primary" id="btn-save-password">
      确认修改
    </button>
  </div>
</div>

<script>
(function () {
  'use strict';

  function getCurrentUser() {
    try {
      var raw = localStorage.getItem('playarg_user');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  var currentUser = getCurrentUser();
  if (!currentUser) {
    window.location.href = '/';
    return;
  }

  // 从 URL 获取 action 参数
  var params = new URLSearchParams(window.location.search);
  var action = params.get('action') || '';

  // 显示用户名
  var usernameEl = document.getElementById('unlock-username');
  if (usernameEl) usernameEl.textContent = currentUser.username || '—';

  // 视图切换
  function showView(viewId) {
    ['view-unlock', 'view-username', 'view-password'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        if (id === viewId) {
          el.style.display = 'block';
          if (el.classList.contains('auth-form-section')) el.classList.add('active');
        } else {
          el.style.display = 'none';
          if (el.classList.contains('auth-form-section')) el.classList.remove('active');
        }
      }
    });
  }

  // 登出
  document.getElementById('btn-logout').addEventListener('click', function (e) {
    e.preventDefault();
    if (!confirm('确定要登出吗？')) return;
    fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
      .finally(function () {
        localStorage.removeItem('playarg_user');
        window.location.href = '/';
      });
  });

  // 解锁验证
  var btnUnlock = document.getElementById('btn-unlock');
  var unlockPwd = document.getElementById('unlock-password');
  var unlockError = document.getElementById('unlock-error');

  function showUnlockError(msg) {
    unlockError.textContent = msg;
    unlockError.classList.add('show');
  }
  function hideUnlockError() {
    unlockError.classList.remove('show');
  }

  btnUnlock.addEventListener('click', function () {
    var pwd = unlockPwd.value;
    if (!pwd) { showUnlockError('请输入密码'); return; }
    hideUnlockError();
    btnUnlock.disabled = true;

    // 调用验证接口（复用 change-password 的逻辑，但只验证不修改）
    fetch('/api/me', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'verify-password', password: pwd })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        btnUnlock.disabled = false;
        if (json.ok) {
          // 验证通过，跳转到对应视图
          if (action === 'change-username') {
            document.getElementById('current-username-display').value = currentUser.username || '';
            showView('view-username');
            document.title = '修改用户名 - PlayARG';
          } else if (action === 'change-password') {
            showView('view-password');
            document.title = '修改密码 - PlayARG';
          } else {
            // 没有指定 action，返回设置页
            window.location.href = '/user/setting';
          }
        } else {
          showUnlockError(json.error || '密码错误');
        }
      })
      .catch(function () {
        btnUnlock.disabled = false;
        showUnlockError('网络错误');
      });
  });

  // 回车解锁
  unlockPwd.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btnUnlock.click();
  });

  // 修改用户名
  var btnSaveUsername = document.getElementById('btn-save-username');
  var usernameError = document.getElementById('username-error');
  var newUsernameInput = document.getElementById('new-username-input');

  function showUsernameError(msg) {
    usernameError.textContent = msg;
    usernameError.classList.add('show');
  }
  function hideUsernameError() {
    usernameError.classList.remove('show');
  }

  btnSaveUsername.addEventListener('click', function () {
    var newName = newUsernameInput.value.trim();
    if (!newName) { showUsernameError('用户名不能为空'); return; }
    if (newName.length < 3 || newName.length > 20) {
      showUsernameError('用户名长度需在 3-20 个字符之间');
      return;
    }
    if (newName === currentUser.username) {
      showUsernameError('新用户名不能与当前用户名相同');
      return;
    }
    hideUsernameError();
    btnSaveUsername.disabled = true;

    fetch('/api/me', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'change-username', username: newName })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        btnSaveUsername.disabled = false;
        if (json.ok) {
          currentUser.username = newName;
          localStorage.setItem('playarg_user', JSON.stringify(currentUser));
          // 成功后返回设置页
          window.location.href = '/user/setting';
        } else {
          showUsernameError(json.error || '修改失败');
        }
      })
      .catch(function () {
        btnSaveUsername.disabled = false;
        showUsernameError('网络错误');
      });
  });

  // 修改密码
  var btnSavePassword = document.getElementById('btn-save-password');
  var passwordError = document.getElementById('password-error');
  var newPwdInput = document.getElementById('new-password-input');
  var confirmPwdInput = document.getElementById('confirm-password-input');

  function showPasswordError(msg) {
    passwordError.textContent = msg;
    passwordError.classList.add('show');
  }
  function hidePasswordError() {
    passwordError.classList.remove('show');
  }

  btnSavePassword.addEventListener('click', function () {
    var newPwd = newPwdInput.value;
    var confirmPwd = confirmPwdInput.value;

    if (!newPwd || newPwd.length < 6) {
      showPasswordError('新密码至少 6 位');
      return;
    }
    if (newPwd !== confirmPwd) {
      showPasswordError('两次输入的新密码不一致');
      return;
    }
    hidePasswordError();
    btnSavePassword.disabled = true;

    // 因为已经通过解锁验证了身份，这里直接修改（使用已验证的方式）
    // 需要带上已解锁的标记，或者直接复用 change-password 但跳过当前密码验证
    // 简单起见：在解锁时我们已经验证过密码了，这里直接调用修改接口
    // 但 change-password 需要 currentPassword，我们没有存...
    // 方案：新增一个 action 或者我们在前端临时存一下
    // 最干净的方案：加一个 'reset-password' action，只有在刚验证过密码后才能用
    // 实际上，我们可以在解锁成功时把密码临时存到内存里
    // 让我改一下：解锁成功时把密码存到变量里

    // 先尝试用解锁时的密码（如果有保存的话）
    var unlockPassword = window.__unlockPassword || '';
    if (!unlockPassword) {
      showPasswordError('验证已过期，请重新解锁');
      setTimeout(function () { showView('view-unlock'); }, 1500);
      return;
    }

    fetch('/api/me', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'change-password',
        currentPassword: unlockPassword,
        newPassword: newPwd
      })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        btnSavePassword.disabled = false;
        if (json.ok) {
          window.__unlockPassword = ''; // 清除
          window.location.href = '/user/setting';
        } else {
          showPasswordError(json.error || '修改失败');
        }
      })
      .catch(function () {
        btnSavePassword.disabled = false;
        showPasswordError('网络错误');
      });
  });

  // 存解锁密码（修改密码时需要）
  var originalUnlockClick = btnUnlock.onclick;
  // 在原有的解锁逻辑中保存密码到内存
  var _btnUnlock = document.getElementById('btn-unlock');
  var origListener = _btnUnlock.onclick;
  // 我们通过包装一下来保存密码
  (function () {
    var btn = document.getElementById('btn-unlock');
    var pwdInput = document.getElementById('unlock-password');
    // 用 MutationObserver 或者直接重写逻辑更简单
    // 其实直接在验证成功的地方保存就好了
    // 上面的 fetch 已经写了，我在那里加一行
  })();

  // 重新实现解锁逻辑中的密码保存
  // 直接替换 btnUnlock 的 click 监听有点复杂，用另一种方式：
  // 在 showView 被调用时，如果从 unlock 切走，就保存密码
  var origShowView = showView;
  showView = function (viewId) {
    if (viewId !== 'view-unlock') {
      window.__unlockPassword = unlockPwd.value;
    }
    origShowView(viewId);
  };

})();
</script>

</body>
</html>
