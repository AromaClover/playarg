<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <title>比赛 - PlayARG</title>
    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

    </style>
    <script src="/assets/tailwind.browser.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

    --color-card: var(--playarg-card);
    --color-card-foreground: var(--playarg-card-foreground);

    --color-secondary: var(--playarg-secondary);
    --color-secondary-foreground: var(--playarg-secondary-foreground);
    --color-muted: var(--playarg-muted);
    --color-muted-foreground: var(--playarg-muted-foreground);

      .text-popover-foreground { color: var(--playarg-popover-foreground); }

      .text-primary { color: var(--playarg-primary); }

      .border-secondary-foreground { border-color: var(--playarg-secondary-foreground); }
      .ring-secondary-foreground { --tw-ring-color: var(--playarg-secondary-foreground); }
      .bg-muted { background-color: var(--playarg-muted); }
      .text-muted { color: var(--playarg-muted); }
      .border-muted { border-color: var(--playarg-muted); }
      .ring-muted { --tw-ring-color: var(--playarg-muted); }
      .bg-muted-foreground { background-color: var(--playarg-muted-foreground); }
      .text-muted-foreground { color: var(--playarg-muted-foreground); }
      .border-muted-foreground { border-color: var(--playarg-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--playarg-muted-foreground); }
      .bg-border { background-color: var(--playarg-border); }
      .text-border { color: var(--playarg-border); }
      .border-border { border-color: var(--playarg-border); }
      .ring-border { --tw-ring-color: var(--playarg-border); }
      .bg-input { background-color: var(--playarg-input); }
      .text-input { color: var(--playarg-input); }

      .ring-input { --tw-ring-color: var(--playarg-input); }
      .bg-ring { background-color: var(--playarg-ring); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('playarg_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
</head>
<body class="min-h-screen font-sans antialiased">

<!-- Top navigation -->
<header class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-[var(--playarg-border)] bg-[var(--playarg-background)]/90 backdrop-blur">
  <div class="flex h-full items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <a href="/" data-dom-id="nav-logo" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-[var(--playarg-primary)] glow-text">
        <img src="/assets/logo.png" class="h-8 w-auto rounded-md" alt="PlayARG" />
        <span>PlayARG</span>
      </a>
    </div>
    <nav class="flex items-center gap-4">
      <a href="/rules" class="text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-foreground)]">规则</a>
      <a href="/sponsors" class="text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-foreground)]">赞助我们</a>
      <button data-dom-id="nav-search" class="flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
        <i data-lucide="search" class="h-4 w-4"></i>
      </button>
      <a href="/messages" data-dom-id="nav-messages" class="relative flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
        <i data-lucide="mail" class="h-4 w-4"></i>
        <span id="nav-messages-badge" class="absolute -right-1 -top-1 hidden min-w-[16px] rounded-full bg-[var(--playarg-state-error)] px-1 text-[10px] font-medium text-white"></span>
      </a>
      <a href="/notifications" data-dom-id="nav-notifications" class="relative flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
        <i data-lucide="bell" class="h-4 w-4"></i>
        <span id="nav-notifications-badge" class="absolute -right-1 -top-1 hidden min-w-[16px] rounded-full bg-[var(--playarg-state-error)] px-1 text-[10px] font-medium text-white"></span>
      </a>
      <div id="auth-root" class="relative"></div>
    </nav>
  </div>
</header>

<!-- Sidebar -->
<aside class="fixed left-0 top-16 bottom-0 z-40 w-56 border-r border-[var(--playarg-border)] bg-[var(--playarg-card)]">
  <nav class="flex flex-col gap-1 p-3">
    <a href="/problems" data-dom-id="sidebar-problems" data-nav-key="problems" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
      <i data-lucide="book-open" class="h-[18px] w-[18px]"></i>
      <span>题库</span>
    </a>
    <a href="/contests" data-dom-id="sidebar-contests" data-nav-key="contests" class="relative flex items-center gap-3 rounded-md bg-[var(--playarg-primary-subtle)] px-3 py-2.5 text-sm font-medium text-[var(--playarg-primary)] transition-colors">
      <i data-lucide="trophy" class="h-[18px] w-[18px]"></i>
      <span>比赛</span>
    </a>
    <a href="/submissions" data-dom-id="sidebar-submissions" data-nav-key="submissions" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
      <i data-lucide="terminal" class="h-[18px] w-[18px]"></i>
      <span>提交记录</span>
    </a>
  </nav>
</aside>

<!-- Main content frame -->
<main id="main-content" class="ml-56 min-h-screen bg-[var(--playarg-background)] pt-16">
  <div class="p-6">
    <div class="mx-auto max-w-5xl">
      <section class="rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-5">
        <div class="mb-3 flex items-center justify-between">
          <h1 class="flex items-center gap-2 text-lg font-semibold text-[var(--playarg-foreground)]">
            <i data-lucide="trophy" class="h-5 w-5 text-[var(--playarg-primary)]"></i>
            比赛列表
          </h1>
          <a href="/contest-create" class="inline-flex items-center gap-1 rounded-md bg-[var(--playarg-primary)] px-3 py-1.5 text-xs font-medium text-[var(--playarg-primary-foreground)] transition-opacity hover:opacity-90">新建比赛</a>
        </div>
        <div class="mb-4">
          <input id="contest-search" type="text" placeholder="搜索比赛" class="h-9 w-full rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-background)] px-3 text-sm text-[var(--playarg-foreground)] placeholder:text-[var(--playarg-muted-foreground)] focus:border-[var(--playarg-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--playarg-ring)]">
        </div>
        <div id="contests-list" class="space-y-2">
          <div class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-background)] p-8 text-center text-sm text-[var(--playarg-muted-foreground)]">加载中…</div>
        </div>
      </section>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="ml-56 border-t border-[var(--playarg-border)] bg-[var(--playarg-card)] py-6">
  <div class="px-8 text-xs text-[var(--playarg-muted-foreground)]">
    PlayARG © 2026
  </div>
</footer>

<script src="/auth.js"></script>
<script>
  (function () {
    function fetchData(url) {
      return fetch(url, { cache: 'no-store', credentials: 'same-origin' }).then(function (res) { return res.json(); });
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatDateTime(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    var allContests = [];

    function renderContests(list) {
      var el = document.getElementById('contests-list');
      if (!el) return;
      var items = (list || []).slice();
      if (!items.length) {
        el.innerHTML = '<div class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-background)] p-6 text-center text-sm text-[var(--playarg-muted-foreground)]">暂无比赛</div>';
        return;
      }
      el.innerHTML = '<div class="space-y-2">' + items.map(function (c) {
        var statusText = { upcoming: '即将开始', running: '进行中', ended: '已结束' }[c.status] || c.status;
        var statusColor = c.status === 'running' ? 'bg-[var(--playarg-state-success)]/10 text-[var(--playarg-state-success)]' : (c.status === 'upcoming' ? 'bg-[var(--playarg-primary)]/10 text-[var(--playarg-primary)]' : 'bg-[var(--playarg-muted-foreground)]/10 text-[var(--playarg-muted-foreground)]');
        var problemCount = Array.isArray(c.problems) ? c.problems.length : 0;
        var modeLabel = c.mode === 'ioi' ? 'IOI' : (c.mode === 'acm' ? 'ICPC' : '普通');
        var isTeam = c.isTeamContest;

        var org = c.organizer || {};
        var orgName = typeof org === 'string' ? org : (org.name || '未知');
        var orgIsAdmin = typeof org !== 'string' && org.role === 'admin';

        // Badges (like Luogu style: 官方比赛, IOI/ICPC, 组队赛)
        var badges = '';
        if (orgIsAdmin) {
          badges += '<span class="inline-flex items-center rounded-sm bg-[var(--playarg-state-error)] px-1.5 py-0.5 text-[10px] font-bold text-white">官方比赛</span>';
        }
        if (isTeam) {
          badges += '<span class="inline-flex items-center rounded-sm bg-[var(--playarg-accent-purple)] px-1.5 py-0.5 text-[10px] font-bold text-white">组队赛' + (c.teamSize ? '(' + c.teamSize + '人)' : '') + '</span>';
        } else {
          badges += '<span class="inline-flex items-center rounded-sm bg-[var(--playarg-primary)]/80 px-1.5 py-0.5 text-[10px] font-bold text-white">' + modeLabel + '</span>';
        }

        return '<a href="/contest-detail?id=' + encodeURIComponent(c.id) + '" class="group flex items-center gap-3 rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-background)] p-3 transition-colors hover:border-[var(--playarg-primary)]/30">' +
          '<div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[var(--playarg-muted)]">' +
            '<i data-lucide="trophy" class="h-4 w-4 text-[var(--playarg-primary)]"></i>' +
          '</div>' +
          '<div class="min-w-0 flex-1">' +
            '<div class="mb-1 flex flex-wrap items-center gap-2">' +
              '<span class="truncate text-sm font-medium text-[var(--playarg-foreground)] group-hover:text-[var(--playarg-primary)]">' + escapeHtml(c.title || c.id) + '</span>' +
              badges +
              '<span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ' + statusColor + '">' + statusText + '</span>' +
            '</div>' +
            '<div class="text-xs text-[var(--playarg-muted-foreground)]">' +
              '<span>' + formatDateTime(c.startTime) + '</span> <span class="mx-1">~</span> <span>' + formatDateTime(c.endTime) + '</span>' +
              '<span class="mx-1">·</span><span>' + problemCount + ' 题</span>' +
              '<span class="mx-1">·</span><span class="' + (orgIsAdmin ? 'text-[var(--playarg-accent-purple)]' : '') + '">' + escapeHtml(orgName) + '</span>' +
            '</div>' +
          '</div>' +
        '</a>';
      }).join('') + '</div>';
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function filterContests(text) {
      var t = String(text || '').toLowerCase().trim();
      if (!t) return renderContests(allContests);
      renderContests(allContests.filter(function (c) {
        var orgName = typeof c.organizer === 'string' ? c.organizer : ((c.organizer && c.organizer.name) || '');
        return String(c.title || c.id || '').toLowerCase().indexOf(t) !== -1 ||
          String(orgName).toLowerCase().indexOf(t) !== -1;
      }));
    }

    function loadContests() {
      fetchData('/api/contests').then(function (json) {
        allContests = (json && json.data) || [];
        renderContests(allContests);
      }).catch(function (err) { console.error('[contests]', err); });
    }

    function bindContestSearch() {
      var input = document.getElementById('contest-search');
      if (!input) return;
      input.addEventListener('input', function () { filterContests(input.value); });
    }

    loadContests();
    bindContestSearch();
  })();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
