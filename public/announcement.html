<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>公告 - PlayARG</title>
    <style id="theme-vars">
/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

    <style>

      [data-icon] {
        display: inline-flex;

        background-color: currentColor;

      .announcement-card[data-expanded="false"] .announcement-full { display: none; }
      .announcement-card[data-expanded="true"] .announcement-full { display: block; }

      .announcement-card[data-expanded="true"] .icon-chevron { transform: rotate(180deg); }

    <script>
      (function() {
        try {
          var t = localStorage.getItem('playarg_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();

<body class="min-h-screen font-sans antialiased">
    <!-- Top navigation -->
    <header class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-[var(--playarg-border)] bg-[var(--playarg-background)]/90 backdrop-blur">
      <div class="flex h-full items-center justify-between px-6">

          <a href="/" data-dom-id="nav-logo" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-[var(--playarg-primary)] glow-text">
            <img src="/assets/logo.png" class="h-8 w-auto rounded-md" alt="PlayARG" />
            <span>PlayARG</span>
          </a>
        </div>
            <nav class="flex items-center gap-4">
      <a href="/rules" class="text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-foreground)]">规则</a>

      <button data-dom-id="nav-search" class="flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">

      <a href="/messages" data-dom-id="nav-messages" class="relative flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">
        <i data-lucide="mail" class="h-4 w-4"></i>
        <span id="nav-messages-badge" class="absolute -right-1 -top-1 hidden min-w-[16px] rounded-full bg-[var(--playarg-state-error)] px-1 text-[10px] font-medium text-white"></span>
      </a>
      <a href="/notifications" data-dom-id="nav-notifications" class="relative flex h-9 w-9 items-center justify-center rounded-md border border-[var(--playarg-border)] text-[var(--playarg-muted-foreground)] transition-colors hover:text-[var(--playarg-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--playarg-ring)]">

      <div id="auth-root" class="relative"></div>
    </nav>
      </div>

    <!-- Sidebar -->

        <a href="/problems" data-dom-id="sidebar-problems" data-nav-key="problems" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[var(--playarg-muted-foreground)] transition-colors hover:bg-[var(--playarg-muted)] hover:text-[var(--playarg-foreground)]">

    <!-- Main content frame -->
    <main id="main-content" class="ml-56 min-h-screen bg-[var(--playarg-background)] pt-16">
      <div class="px-8 py-8">
        <!-- Page header -->
        <div class="mb-6 flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight text-[var(--playarg-foreground)]">公告</h1>
            <p class="mt-1 text-sm text-[var(--playarg-muted-foreground)]">平台动态、比赛通知与系统维护</p>

            <span>订阅更新</span>
          </div>
        </div>

        <!-- Featured announcement (pinned) -->
        <div id="announcement-pinned"></div>

        <!-- Announcement timeline -->
        <section aria-label="公告时间线">
          <h3 class="mb-4 text-sm font-medium uppercase tracking-wide text-[var(--playarg-muted-foreground)]">历史公告</h3>
          <div id="announcement-list" class="space-y-3">
            <div class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-muted-foreground)]">加载中…</div>

    <!-- Footer -->
    <footer class="ml-56 border-t border-[var(--playarg-border)] bg-[var(--playarg-card)] py-6">
      <div class="px-8 text-xs text-[var(--playarg-muted-foreground)]">
        PlayARG © 2026
      </div>
    </footer>

    <script src="/auth.js"></script>
    <script>
      (function () {
        function escapeHtml(str) {
          if (str == null) return '';
          return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function nl2br(str) {
          return escapeHtml(str).replace(/\n/g, '<br>');
        }

        function renderCard(a, expanded, isPinned) {
          var badge = isPinned ?
            '<span class="inline-flex items-center gap-1.5 rounded-full bg-[var(--playarg-primary)] px-2.5 py-1 text-xs font-medium text-[var(--playarg-primary-foreground)]"><i data-lucide="pin" class="h-3 w-3"></i>置顶</span>' : '';
          var categoryClass = 'bg-[var(--playarg-muted)] text-[var(--playarg-muted-foreground)]';
          if (a.category === '维护') categoryClass = 'bg-[var(--playarg-state-warning)]/10 text-[var(--playarg-state-warning)]';
          else if (a.category === '功能') categoryClass = 'bg-[var(--playarg-state-success)]/10 text-[var(--playarg-state-success)]';
          else if (a.category === '比赛') categoryClass = 'bg-[var(--playarg-state-info)]/10 text-[var(--playarg-state-info)]';
          else if (a.category === '安全') categoryClass = 'bg-[var(--playarg-state-error)]/10 text-[var(--playarg-state-error)]';
          else if (a.category === '平台') categoryClass = 'bg-[var(--playarg-state-info)]/10 text-[var(--playarg-state-info)]';

          var html = '<article class="announcement-card rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] transition-colors hover:border-[var(--playarg-primary)]/30" data-expanded="' + (expanded ? 'true' : 'false') + '">' +
            '<button type="button" class="announcement-toggle flex w-full items-start justify-between p-5 text-left">' +
              '<div class="flex flex-1 flex-col gap-2 pr-4">' +
                '<div class="flex flex-wrap items-center gap-3">' + badge +
                  '<span class="rounded-md ' + categoryClass + ' px-2 py-1 text-xs font-medium">' + escapeHtml(a.category) + '</span>' +
                  '<time class="text-xs text-[var(--playarg-muted-foreground)]" datetime="' + escapeHtml(a.date) + '">' + escapeHtml(a.date) + '</time>' +
                '</div>' +
                '<h4 class="text-base font-medium text-[var(--playarg-foreground)]">' + escapeHtml(a.title) + '</h4>' +
                '<p class="text-sm text-[var(--playarg-muted-foreground)]">' + escapeHtml(a.content || '') + '</p>' +
              '</div>' +
              '<i data-lucide="chevron-down" class="icon-chevron mt-1 h-5 w-5 shrink-0 text-[var(--playarg-muted-foreground)] transition-transform duration-200"></i>' +
            '</button>' +
            '<div class="announcement-full border-t border-[var(--playarg-border)] px-5 pb-5 pt-4">' +
              '<div class="text-sm leading-relaxed text-[var(--playarg-foreground)]">' + nl2br(a.fullContent || a.content || '') + '</div>' +
            '</div>' +
          '</article>';
          return html;
        }

        function bindToggles() {
          document.querySelectorAll('.announcement-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var card = btn.closest('.announcement-card');
              var expanded = card.getAttribute('data-expanded') === 'true';
              card.setAttribute('data-expanded', expanded ? 'false' : 'true');
            });
          });
        }

        fetch('/api/announcements').then(function (res) { return res.json(); }).then(function (json) {
          var list = (json && json.data) || [];
          var pinned = list.filter(function (a) { return a.pinned; });
          var normal = list.filter(function (a) { return !a.pinned; });

          var pinnedEl = document.getElementById('announcement-pinned');
          if (pinnedEl) {
            if (pinned.length) {
              pinnedEl.innerHTML = pinned.map(function (a) { return '<div class="mb-6">' + renderCard(a, true, true) + '</div>'; }).join('');
            } else {
              pinnedEl.innerHTML = '';
            }
          }

          var listEl = document.getElementById('announcement-list');
          if (listEl) {
            if (normal.length) {
              listEl.innerHTML = normal.map(function (a) { return renderCard(a, false, false); }).join('');
            } else {
              listEl.innerHTML = '<div class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-muted-foreground)]">暂无公告</div>';
            }
          }
          bindToggles();
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }).catch(function (err) {
          console.error(err);
          document.getElementById('announcement-list').innerHTML = '<div class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-state-error)]">加载失败</div>';
        });
      })();
    </script>
</body>
</html>
