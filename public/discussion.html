/* PlayARG — Dark geek theme tokens */

:root {
  /* Core dark surfaces */
  --playarg-background: #0b0c10;
  --playarg-foreground: #e8e8ec;
  --playarg-card: #111318;
  --playarg-card-foreground: #e8e8ec;
  --playarg-popover: #151821;
  --playarg-popover-foreground: #e8e8ec;

  /* Primary accent — cyan/teal glow */
  --playarg-primary: #00d9ff;
  --playarg-primary-foreground: #030507;
  --playarg-primary-subtle: rgba(0, 217, 255, 0.12);
  --playarg-primary-dim: rgba(0, 217, 255, 0.06);

  /* Muted / secondary */
  --playarg-muted: #1a1d25;
  --playarg-muted-foreground: #8a8f98;
  --playarg-secondary: #1e212b;
  --playarg-secondary-foreground: #d1d5db;

  /* Borders & inputs */
  --playarg-border: #2a2e3a;
  --playarg-input: #2a2e3a;
  --playarg-ring: rgba(0, 217, 255, 0.45);

  /* Radius */
  --playarg-radius-small: 4px;
  --playarg-radius-medium: 8px;
  --playarg-radius-large: 12px;

  /* State colors */
  --playarg-state-success: #22c55e;
  --playarg-state-warning: #f59e0b;
  --playarg-state-error: #ef4444;
  --playarg-state-info: #3b82f6;

  /* Code / data */
  --playarg-code-bg: #0d0f14;
  --playarg-code-fg: #e8e8ec;
  --playarg-accent-purple: #a855f7;
  --playarg-accent-green: #4ade80;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Noto Sans SC", monospace;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 217, 255, 0.14);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--playarg-background);
  --color-foreground: var(--playarg-foreground);
  --color-card: var(--playarg-card);
  --color-card-foreground: var(--playarg-card-foreground);
  --color-popover: var(--playarg-popover);
  --color-popover-foreground: var(--playarg-popover-foreground);
  --color-primary: var(--playarg-primary);
  --color-primary-foreground: var(--playarg-primary-foreground);
  --color-secondary: var(--playarg-secondary);
  --color-secondary-foreground: var(--playarg-secondary-foreground);
  --color-muted: var(--playarg-muted);
  --color-muted-foreground: var(--playarg-muted-foreground);
  --color-border: var(--playarg-border);
  --color-input: var(--playarg-input);
  --color-ring: var(--playarg-ring);
  --radius-sm: var(--playarg-radius-small);
  --radius-md: var(--playarg-radius-medium);
  --radius-lg: var(--playarg-radius-large);
}

/* Base */
html,
body {
  font-family: var(--font-sans);
  background: var(--playarg-background);
  color: var(--playarg-foreground);
}

.font-mono {
  font-family: var(--font-mono);
}

/* Glow utilities */
.glow-text {
  text-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
}

.glow-border {
  box-shadow: 0 0 0 1px var(--playarg-border), 0 0 18px rgba(0, 217, 255, 0.12);
}

/* Scrollbar dark */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--playarg-background);
}
::-webkit-scrollbar-thumb {
  background: var(--playarg-border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

/* Code block base */
pre,
code {
  font-family: var(--font-mono);
}

          if (t === 'dark') {

<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function relativeTime(iso) {
    var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    return Math.floor(diff / 86400) + ' 天前';
  }
  function getLocalUser() {
    try { var raw = localStorage.getItem('playarg_user'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function initials(name) {
    return String(name || '?').slice(0, 2).toUpperCase();
  }
  function adminTag(item, keyPrefix) {
    var isOwner = item[keyPrefix + 'IsOwner'];
    var role = item[keyPrefix + 'Role'];
    var badgeText = item[keyPrefix + 'AdminBadgeText'];
    if (isOwner) return '<span class="ml-1 inline-flex items-center rounded-full bg-[var(--playarg-accent-purple)]/15 px-2 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">站主</span>';
    if (role === 'admin') return '<span class="ml-1 inline-flex items-center rounded-full bg-[var(--playarg-accent-purple)]/15 px-2 py-0.5 text-[10px] font-medium text-[var(--playarg-accent-purple)]">' + escapeHtml(badgeText || '管理员') + '</span>';
    return '';
  }
  function usernameClass(item, keyPrefix) {
    return (item[keyPrefix + 'IsOwner'] || item[keyPrefix + 'Role'] === 'admin') ? 'text-[var(--playarg-accent-purple)]' : 'text-[var(--playarg-primary)]';
  }

  var allDiscussions = [];
  var currentSort = 'hot';

  function fetchData(url) {
    return fetch(url, { cache: 'no-store' }).then(function (res) { return res.json(); });
  }

  function sortGroup(arr) {
    var copy = arr.slice();
    if (currentSort === 'latest') {
      copy.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    } else {
      copy.sort(function (a, b) { return ((b.replies || 0) + (b.views || 0)) - ((a.replies || 0) + (a.views || 0)); });
    }
    return copy;
  }

  function renderList() {
    var pinned = allDiscussions.filter(function (d) { return d.pinned; });
    var unpinned = allDiscussions.filter(function (d) { return !d.pinned; });
    var list = sortGroup(pinned).concat(sortGroup(unpinned));
    var el = document.getElementById('discussion-list');
    var countEl = document.getElementById('discussion-count');
    if (countEl) countEl.textContent = '共 ' + list.length + ' 个帖子';
    if (!list.length) {
      el.innerHTML = '<div class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-muted-foreground)]">还没有帖子，来做第一个发帖的人吧！</div>';
      return;
    }
    el.innerHTML = list.map(function (d) {
      var tagsHtml = (d.tags || []).map(function (t) {
        return '<span class="rounded px-2 py-0.5 text-xs font-medium bg-[var(--playarg-muted)] text-[var(--playarg-muted-foreground)]">' + escapeHtml(t) + '</span>';
      }).join('');
      var pinnedBadge = d.pinned ? '<span class="mr-1.5 rounded bg-[var(--playarg-primary)] px-1.5 py-0.5 text-[10px] font-medium text-[var(--playarg-primary-foreground)]">置顶</span>' : '';
      return '<article class="rounded-lg border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-4 transition-colors hover:border-[var(--playarg-primary)]/30">' +
        '<div class="flex items-start justify-between gap-4">' +
          '<div class="flex flex-col gap-2">' +
            '<h2 class="text-base font-medium text-[var(--playarg-foreground)] transition-colors hover:text-[var(--playarg-primary)]">' +
              pinnedBadge +
              '<a href="/discussion/' + encodeURIComponent(d.id) + '">' + escapeHtml(d.title) + '</a>' +
            '</h2>' +
            '<div class="flex flex-wrap items-center gap-2 text-xs text-[var(--playarg-muted-foreground)]">' +
              '<span class="flex items-center gap-1 font-medium ' + usernameClass(d, 'author') + '"><i data-lucide="user" class="h-3 w-3"></i>' + escapeHtml(d.author) + adminTag(d, 'author') + '</span>' +
              '<span class="h-3 w-px bg-[var(--playarg-border)]"></span>' +
              '<span>' + escapeHtml(relativeTime(d.createdAt)) + ' 发布</span>' +
            '</div>' +
            '<div class="flex flex-wrap items-center gap-2">' + tagsHtml + '</div>' +
          '</div>' +
          '<div class="flex shrink-0 items-center gap-4 text-xs text-[var(--playarg-muted-foreground)]">' +
            '<span class="flex items-center gap-1"><i data-lucide="message-circle" class="h-3.5 w-3.5"></i>' + (d.replies || 0) + '</span>' +
            '<span class="flex items-center gap-1"><i data-lucide="eye" class="h-3.5 w-3.5"></i>' + (d.views || 0) + '</span>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function renderTags() {
    var counts = {};
    allDiscussions.forEach(function (d) {
      (d.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });
    var sorted = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 12);
    var el = document.getElementById('discussion-tags');
    if (!sorted.length) { el.innerHTML = '<span class="text-xs text-[var(--playarg-muted-foreground)]">暂无标签</span>'; return; }
    el.innerHTML = sorted.map(function (t) {
      return '<a href="#" class="rounded-md border border-[var(--playarg-border)] px-2.5 py-1 text-xs text-[var(--playarg-muted-foreground)] transition-colors hover:border-[var(--playarg-primary)]/50 hover:text-[var(--playarg-primary)]">' + escapeHtml(t) + '</a>';
    }).join('');
  }

  function renderAuthors() {
    var counts = {};
    allDiscussions.forEach(function (d) {
      if (!d.author) return;
      counts[d.author] = (counts[d.author] || 0) + 1;
    });
    var sorted = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 5);
    var el = document.getElementById('discussion-authors');
    if (!sorted.length) { el.innerHTML = '<span class="text-xs text-[var(--playarg-muted-foreground)]">暂无作者</span>'; return; }
    el.innerHTML = sorted.map(function (name) {
      return '<a href="#" class="flex items-center gap-3 rounded-md p-2 transition-colors hover:bg-[var(--playarg-muted)]">' +
        '<div class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--playarg-primary-subtle)] text-[var(--playarg-primary)] text-xs font-medium">' + initials(name) + '</div>' +
        '<div class="flex flex-col">' +
          '<span class="text-sm text-[var(--playarg-foreground)]">' + escapeHtml(name) + '</span>' +
          '<span class="text-xs text-[var(--playarg-muted-foreground)]">发帖 ' + counts[name] + '</span>' +
        '</div></a>';
    }).join('');
  }

  function loadDiscussions() {
    fetchData('/api/discussions').then(function (json) {
      allDiscussions = (json && json.data) || [];
      renderList();
      renderTags();
      renderAuthors();
    }).catch(function (err) {
      console.error('[discussions]', err);
      document.getElementById('discussion-list').innerHTML = '<div class="rounded-md border border-[var(--playarg-border)] bg-[var(--playarg-card)] p-8 text-center text-sm text-[var(--playarg-state-error)]">加载失败</div>';
    });
  }

  var modal = document.getElementById('new-post-modal');
  function openModal() { modal.classList.remove('hidden'); modal.classList.add('flex'); }
  function closeModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); document.getElementById('new-post-error').classList.add('hidden'); }
  document.getElementById('btn-new-post').addEventListener('click', function () {
    if (!getLocalUser()) { alert('请先登录'); return; }
    openModal();
  });
  document.getElementById('btn-close-modal').addEventListener('click', closeModal);
  document.getElementById('btn-cancel-post').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  document.getElementById('btn-submit-post').addEventListener('click', function () {
    var btn = document.getElementById('btn-submit-post');
    var title = document.getElementById('new-post-title').value.trim();
    var content = document.getElementById('new-post-content').value.trim();
    var tags = document.getElementById('new-post-tags').value.trim();
    var errEl = document.getElementById('new-post-error');
    if (!title) { errEl.textContent = '标题不能为空'; errEl.classList.remove('hidden'); return; }
    if (!content) { errEl.textContent = '正文不能为空'; errEl.classList.remove('hidden'); return; }
    btn.disabled = true;
    fetch('/api/discussions', { method: 'POST', cache: 'no-store', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, content: content, tags: tags }) })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        btn.disabled = false;
        if (json.ok) { document.getElementById('new-post-title').value = ''; document.getElementById('new-post-content').value = ''; document.getElementById('new-post-tags').value = ''; closeModal(); loadDiscussions(); }
        else { errEl.textContent = json.error || '发布失败'; errEl.classList.remove('hidden'); }
      })
      .catch(function (err) { btn.disabled = false; errEl.textContent = '网络错误'; errEl.classList.remove('hidden'); console.error(err); });
  });

  loadDiscussions();
})();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
